name: Build GKI Kernel with KernelSU Variants (hardened)

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: KernelSU variant to build
        required: true
        default: all
        type: choice
        options:
          - all
          - tiann
          - kowsu
          - resukisu
          - next
      enable_susfs:
        description: Enable SuSFS features
        required: false
        default: true
        type: boolean
      force_clean_build:
        description: Force clean build
        required: false
        default: false
        type: boolean
      enable_telegram:
        description: Enable Telegram notifications
        required: false
        default: true
        type: boolean
      create_release:
        description: Create GitHub release with artifacts
        required: false
        default: true
        type: boolean
      debug:
        description: Enable shell debug tracing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: kernel-build-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_REPO_URL: https://android.googlesource.com/kernel/common
  KERNEL_BRANCH: android14-6.1-2026-03
  SUSFS_REPO_URL: https://gitlab.com/simonpunk/susfs4ksu
  SUSFS_BRANCH: gki-android14-6.1-dev
  ANYKERNEL_REPO_URL: https://github.com/deepongi-labs/AnyKernel3-p8a
  ANYKERNEL_FALLBACK_BRANCH: main
  CLANG_BIN: /mnt/Hawai/toolchains/Clang-23.0.0git-20260130/bin
  ARM64_TOOLCHAIN: /mnt/Hawai/toolchains/arm-gnu-toolchain-15.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-
  ARM32_TOOLCHAIN: /mnt/Hawai/toolchains/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-
  CCACHE_DIR: /mnt/ccache/.ccache

jobs:
  setup:
    runs-on: [self-hosted, linux, x64]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build_start_time: ${{ steps.timestamp.outputs.start_time }}
      workspace_root: ${{ steps.vars.outputs.workspace_root }}
    steps:
      - name: Record build start time
        id: timestamp
        shell: bash
        run: |
          set -euo pipefail
          start_time="$(date +%s)"
          echo "start_time=$start_time" >> "$GITHUB_OUTPUT"
          echo "::notice::Workflow started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Compute matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          variant='${{ inputs.ksu_variant }}'
          if [[ "$variant" == "all" ]]; then
            echo 'matrix={"variant":["tiann","kowsu","resukisu","next"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"variant\":[\"$variant\"]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Define isolated workspace root
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/kernel-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$root"
          echo "workspace_root=$root" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      KSU_VARIANT: ${{ matrix.variant }}
      ENABLE_SUSFS: ${{ inputs.enable_susfs }}
      FORCE_CLEAN: ${{ inputs.force_clean_build }}
      DEBUG_BUILD: ${{ inputs.debug }}
      WORK_ROOT: ${{ needs.setup.outputs.workspace_root }}/${{ matrix.variant }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Validate runner toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail
          required=(git curl patch zip make sed grep awk find xargs ccache)
          for bin in "${required[@]}"; do
            command -v "$bin" >/dev/null 2>&1 || { echo "Missing required binary: $bin"; exit 1; }
          done
          test -x "${CLANG_BIN}/clang" || { echo "Missing clang at ${CLANG_BIN}/clang"; exit 1; }
          test -x "${CLANG_BIN}/ld.lld" || { echo "Missing ld.lld at ${CLANG_BIN}/ld.lld"; exit 1; }
          arm64_dir="$(dirname "${ARM64_TOOLCHAIN}")"
          arm64_prefix="$(basename "${ARM64_TOOLCHAIN}")"
          arm32_dir="$(dirname "${ARM32_TOOLCHAIN}")"
          arm32_prefix="$(basename "${ARM32_TOOLCHAIN}")"
          compgen -G "${arm64_dir}/${arm64_prefix}*" >/dev/null || { echo "Missing ARM64 toolchain prefix near ${ARM64_TOOLCHAIN}"; ls -la "${arm64_dir}" || true; exit 1; }
          compgen -G "${arm32_dir}/${arm32_prefix}*" >/dev/null || { echo "Missing ARM32 toolchain prefix near ${ARM32_TOOLCHAIN}"; ls -la "${arm32_dir}" || true; exit 1; }
          df -h .

      - name: Prepare isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_ROOT"
          mkdir -p "$WORK_ROOT"
          mkdir -p "$CCACHE_DIR"

      - name: Sync sources
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEBUG_BUILD" == "true" ]] && set -x
          git clone --depth=1 --branch="${KERNEL_BRANCH}" "${KERNEL_REPO_URL}" "$WORK_ROOT/kernel"
          git clone --depth=1 --branch="${SUSFS_BRANCH}" "${SUSFS_REPO_URL}" "$WORK_ROOT/susfs4ksu"

      - name: Record source metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          {
            echo "WORKFLOW_COMMIT_SHORT=$(git rev-parse --short HEAD)"
            echo "WORKFLOW_COMMIT_MSG=$(git log -1 --format=%s)"
            echo "WORKFLOW_COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_ENV"
          cd "$WORK_ROOT/kernel"
          {
            echo "KERNEL_COMMIT_SHORT=$(git rev-parse --short HEAD)"
            echo "KERNEL_COMMIT_MSG=$(git log -1 --format=%s)"
            echo "KERNEL_COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_ENV"
          cd "$WORK_ROOT/susfs4ksu"
          {
            echo "SUSFS_COMMIT_SHORT=$(git rev-parse --short HEAD)"
            echo "SUSFS_COMMIT_MSG=$(git log -1 --format=%s)"
            echo "SUSFS_COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_ENV"

      - name: Show ccache status
        shell: bash
        run: |
          set -euo pipefail
          export CCACHE_DIR="${CCACHE_DIR}"
          ccache -s || true

      - name: Setup KernelSU variant
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEBUG_BUILD" == "true" ]] && set -x
          cd "$WORK_ROOT/kernel"
          rm -rf KernelSU drivers/kernelsu KernelSU-Next
          case "$KSU_VARIANT" in
            tiann)
              KSU_REPO="tiann/KernelSU"
              KSU_BRANCH="main"
              AK3_BRANCH="KernelSU"
              ;;
            kowsu)
              KSU_REPO="KOWX712/KernelSU"
              KSU_BRANCH="master"
              AK3_BRANCH="KowSU"
              ;;
            resukisu)
              KSU_REPO="ReSukiSU/ReSukiSU"
              KSU_BRANCH="main"
              AK3_BRANCH="resukisu"
              ;;
            next)
              KSU_REPO="KernelSU-Next/KernelSU-Next"
              KSU_BRANCH="dev"
              AK3_BRANCH="next"
              ;;
            *)
              echo "Unknown variant: $KSU_VARIANT"
              exit 1
              ;;
          esac
          git clone --depth=1 --branch="$KSU_BRANCH" "https://github.com/${KSU_REPO}.git" KernelSU
          test -d KernelSU/kernel || { echo "KernelSU/kernel missing for ${KSU_REPO}"; exit 1; }
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          {
            echo "KSU_REPO=$KSU_REPO"
            echo "KSU_BRANCH=$KSU_BRANCH"
            echo "AK3_BRANCH=$AK3_BRANCH"
          } >> "$GITHUB_ENV"

      - name: Compute KernelSU version metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_ROOT/kernel/KernelSU"
          git fetch --unshallow --quiet || git fetch --depth=10000 --quiet || true
          if [[ "$KSU_VARIANT" == "resukisu" ]]; then
            git fetch origin main:main --quiet || true
            ksu_count="$(git rev-list --count main)"
            ksu_version="$((40000 + ksu_count - 2815))"
          else
            ksu_count="$(git rev-list --count HEAD)"
            ksu_version="$((ksu_count + 30000))"
          fi
          {
            echo "KSU_VERSION=$ksu_version"
            echo "KSU_COMMIT_SHORT=$(git rev-parse --short HEAD)"
            echo "KSU_COMMIT_MSG=$(git log -1 --format=%s)"
            echo "KSU_COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_ENV"

      - name: Generate changelog
        if: inputs.create_release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT/changelogs"
          changefile="$WORK_ROOT/changelogs/CHANGELOG-${KSU_VARIANT}.md"
          cat > "$changefile" <<EOF
          # Build Changelog

          - Variant: ${KSU_VARIANT}
          - Build Number: #${GITHUB_RUN_NUMBER}
          - KernelSU Version: r${KSU_VERSION}
          - SuSFS: $([[ "${ENABLE_SUSFS}" == "true" ]] && echo Enabled || echo Disabled)

          ## Component Versions

          | Component | Commit | Commit Date | Summary |
          |---|---|---|---|
          | KernelSU | \\`${KSU_COMMIT_SHORT}\\` | ${KSU_COMMIT_DATE} | ${KSU_COMMIT_MSG} |
          | Kernel | \\`${KERNEL_COMMIT_SHORT}\\` | ${KERNEL_COMMIT_DATE} | ${KERNEL_COMMIT_MSG} |
          | SuSFS4KSU | \\`${SUSFS_COMMIT_SHORT}\\` | ${SUSFS_COMMIT_DATE} | ${SUSFS_COMMIT_MSG} |
          | Workflow | \\`${WORKFLOW_COMMIT_SHORT}\\` | ${WORKFLOW_COMMIT_DATE} | ${WORKFLOW_COMMIT_MSG} |
          EOF
          echo "CHANGELOG_FILE=$changefile" >> "$GITHUB_ENV"

      - name: Apply SuSFS patches
        if: env.ENABLE_SUSFS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEBUG_BUILD" == "true" ]] && set -x
          cp "$WORK_ROOT/susfs4ksu/kernel_patches/fs/susfs.c" "$WORK_ROOT/kernel/fs/"
          cp "$WORK_ROOT/susfs4ksu/kernel_patches/include/linux/susfs.h" "$WORK_ROOT/kernel/include/linux/"
          cp "$WORK_ROOT/susfs4ksu/kernel_patches/include/linux/susfs_def.h" "$WORK_ROOT/kernel/include/linux/"
          cd "$WORK_ROOT/kernel"
          variant_patch="$GITHUB_WORKSPACE/.github/patches/${KSU_VARIANT}/50_add_susfs_in_gki-android14-6.1.patch"
          default_patch="$WORK_ROOT/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          if [[ -f "$variant_patch" ]]; then
            patch -p1 --forward < "$variant_patch"
          else
            patch -p1 --forward < "$default_patch"
          fi
          if [[ "$KSU_VARIANT" != "resukisu" && "$KSU_VARIANT" != "next" ]]; then
            cd "$WORK_ROOT/kernel/KernelSU"
            variant_ksu_patch="$GITHUB_WORKSPACE/.github/patches/${KSU_VARIANT}/10_enable_susfs_for_ksu.patch"
            default_ksu_patch="$WORK_ROOT/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            if [[ -f "$variant_ksu_patch" ]]; then
              patch -p1 --forward < "$variant_ksu_patch"
            else
              patch -p1 --forward < "$default_ksu_patch"
            fi
          fi

      - name: Apply repo-local hardening patches and source fixes
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_ROOT/kernel"
          rm -f android/abi_gki_protected_exports_* || true
          sed -i '/# Check for uncommitted changes\./,/fi/d' scripts/setlocalversion
          sed -i 's/next_path = strchr(s, '\''':'\'');/next_path = (char *)strchr(s, '\''':'\'');/' tools/lib/bpf/libbpf.c

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_ROOT/kernel"
          export ARCH=arm64
          export PATH="${CLANG_BIN}:/usr/lib/ccache:$PATH"
          export CROSS_COMPILE="${ARM64_TOOLCHAIN}"
          export CROSS_COMPILE_COMPAT="${ARM32_TOOLCHAIN}"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld O=out gki_defconfig
          cat >> out/.config <<'EOF'
          CONFIG_ARM64_CORTEX_X3=y
          CONFIG_ARM64_CORTEX_A715=y
          CONFIG_ARM64_CORTEX_A510=y
          CONFIG_ARM64_VA_BITS=48
          CONFIG_ARM64_PA_BITS=48
          CONFIG_SCHED_MC=y
          CONFIG_SCHED_CORE=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_CPU_FREQ=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_THERMAL=y
          CONFIG_CMA=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_IP_SET=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_KSU=y
          CONFIG_LOCALVERSION="-deepongi+"
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          EOF
          if [[ "${ENABLE_SUSFS}" == "true" ]]; then
            cat >> out/.config <<'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_NEXT_SUSFS=y
          CONFIG_KSU_NEXT_SUSFS_SUS_PATH=y
          CONFIG_KSU_NEXT_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_NEXT_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_NEXT_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_NEXT_SUSFS_ENABLE_LOG=y
          EOF
          fi
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld O=out olddefconfig

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEBUG_BUILD" == "true" ]] && set -x
          cd "$WORK_ROOT/kernel"
          export ARCH=arm64
          export CROSS_COMPILE="${ARM64_TOOLCHAIN}"
          export CROSS_COMPILE_COMPAT="${ARM32_TOOLCHAIN}"
          export CCACHE_DIR="${CCACHE_DIR}"
          ccpath="$(command -v ccache || true)"
          if [[ -n "$ccpath" ]]; then
            mkdir -p ccache-bin
            ln -sfn "$ccpath" ccache-bin/clang
            ln -sfn "$ccpath" ccache-bin/clang++
            export PATH="$PWD/ccache-bin:${CLANG_BIN}:$PATH"
          else
            export PATH="${CLANG_BIN}:$PATH"
          fi
          jobs="$(nproc)"
          start="$(date +%s)"
          if [[ "${FORCE_CLEAN}" == "true" ]]; then
            make -j"$jobs" LLVM=1 LLVM_IAS=1 LD=ld.lld O=out clean
          fi
          make -j"$jobs" LLVM=1 LLVM_IAS=1 LD=ld.lld HOSTLD=ld.lld O=out
          end="$(date +%s)"
          echo "BUILD_TIME=$((end - start))s" >> "$GITHUB_ENV"

      - name: Package kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_ROOT/kernel"
          kernel_version="$(grep '^VERSION' Makefile | awk '{print $3}').$(grep '^PATCHLEVEL' Makefile | awk '{print $3}').$(grep '^SUBLEVEL' Makefile | awk '{print $3}')"
          cd "$WORK_ROOT"
          git clone --depth=1 --branch="${AK3_BRANCH}" "${ANYKERNEL_REPO_URL}" AnyKernel3 || \
            git clone --depth=1 --branch="${ANYKERNEL_FALLBACK_BRANCH}" "${ANYKERNEL_REPO_URL}" AnyKernel3
          cp "$WORK_ROOT/kernel/out/arch/arm64/boot/Image" AnyKernel3/
          [[ -f "$WORK_ROOT/kernel/out/arch/arm64/boot/dtb" ]] && cp "$WORK_ROOT/kernel/out/arch/arm64/boot/dtb" AnyKernel3/
          cd AnyKernel3
          rm -rf .git .github
          zip_name="AK3-${kernel_version}-${KSU_VARIANT}-r${KSU_VERSION}.zip"
          zip -r9 "${WORK_ROOT}/${zip_name}" .
          echo "KERNEL_ZIP=${WORK_ROOT}/${zip_name}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}-${{ github.run_number }}
          if-no-files-found: error
          path: |
            ${{ env.KERNEL_ZIP }}
            ${{ env.CHANGELOG_FILE }}

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          rm -rf "$WORK_ROOT"

  create_release:
    needs: [setup, build]
    runs-on: [self-hosted, linux, x64]
    if: always() && inputs.create_release && needs.build.result != 'cancelled'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release-assets-${{ github.run_id }}

      - name: Create GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/release-assets-${GITHUB_RUN_ID}"
          cd "$release_dir"
          find . -type f -exec mv -n {} . \; 2>/dev/null || true
          shopt -s nullglob
          zips=(./*.zip)
          mds=(./*.md)
          if (( ${#zips[@]} == 0 )); then
            echo "No ZIP artifacts found; skipping release creation."
            exit 0
          fi
          release_notes=$(cat <<EOF
          **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **SuSFS:** $([[ '${{ inputs.enable_susfs }}' == 'true' ]] && echo '✅ Enabled' || echo '❌ Disabled')

          ### Devices Supported
          - Pixel 8
          - Pixel 8a
          - Pixel 8 Pro

          Flash ZIP in Kernel Flasher or extract Image to patch boot.img manually.
          EOF
          )
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            --title "Android 14 Kernel Build #${GITHUB_RUN_NUMBER}" \
            --notes "$release_notes" \
            --repo "${GITHUB_REPOSITORY}" \
            "${zips[@]}" "${mds[@]}"

  notify:
    needs: [build, create_release]
    runs-on: [self-hosted, linux, x64]
    if: always() && inputs.enable_telegram
    steps:
      - name: Send Telegram notification
        shell: bash
        run: |
          set -euo pipefail
          status='${{ needs.build.result }}'
          icon='✅'
          [[ "$status" != 'success' ]] && icon='⚠️'
          [[ "$status" == 'failure' ]] && icon='❌'
          clean_build=$([[ '${{ inputs.force_clean_build }}' == 'true' ]] && echo Yes || echo No)
          susfs_state=$([[ '${{ inputs.enable_susfs }}' == 'true' ]] && echo Enabled || echo Disabled)
          release_state=$([[ '${{ inputs.create_release }}' == 'true' ]] && echo Yes || echo No)
          cat > tg_message.txt <<EOF
          ${icon} <b>Kernel Build ${status^^}</b>
          ━━━━━━━━━━━━━━━━━━━━━
          📱 <b>Target:</b> Pixel 8 / 8a / 8 Pro
          🛠️ <b>Variant(s):</b> ${{ inputs.ksu_variant }}
          🛡️ <b>SuSFS:</b> ${susfs_state}
          🧹 <b>Clean Build:</b> ${clean_build}
          📦 <b>Release Created:</b> ${release_state}
          👤 <b>Triggered by:</b> <a href="https://github.com/${GITHUB_ACTOR}">${GITHUB_ACTOR}</a>

          🔗 <a href="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}">View Run Logs & Artifacts</a>
          EOF
          curl -fsS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text@tg_message.txt \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true
