name: Build GKI Kernel with KernelSU Variants v4.4.2

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU variant to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - tiann
          - kowsu
          - resukisu
          - next
      disable_susfs:
        description: 'Disable SuSFS features'
        required: false
        default: false
        type: boolean
      force_clean_build:
        description: 'Force clean build (ignore cache)'
        required: false
        default: false
        type: boolean
      enable_telegram:
        description: 'Enable Telegram notifications'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: true
        type: boolean
      debug:
        description: 'Enable debug output'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  # Configurable paths with sensible defaults for GitHub-hosted runners
  # Self-hosted runners can override these via environment variables
  CLANG_BIN: /usr/lib/llvm-17/bin
  ARM64_TOOLCHAIN: aarch64-linux-gnu-
  ARM32_TOOLCHAIN: arm-linux-gnueabihf-
  CCACHE_DIR: /mnt/ccache/.ccache

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      enable_susfs: ${{ steps.config.outputs.enable_susfs }}
      force_clean: ${{ steps.config.outputs.force_clean }}
      build_start_time: ${{ steps.timestamp.outputs.start_time }}
      create_release: ${{ steps.config.outputs.create_release }}
    steps:
      - name: Record Build Start Time
        id: timestamp
        run: |
          echo "WORKFLOW_START_TIME=$(date +%s)" >> $GITHUB_ENV
          START_TIME=$(date +%s)
          echo "start_time=$START_TIME" >> $GITHUB_OUTPUT
          echo "::notice::Workflow started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set Build Matrix
        id: set-matrix
        run: |
          VARIANT="${{ github.event.inputs.ksu_variant }}"
          
          if [ "$VARIANT" = "all" ]; then
            echo 'matrix={"variant":["tiann","kowsu","resukisu","next"]}' >> $GITHUB_OUTPUT
            echo "🎯 Building all stable variants"
          else
            echo "matrix={\"variant\":[\"$VARIANT\"]}" >> $GITHUB_OUTPUT
            echo "🎯 Building single variant: $VARIANT"
          fi

      - name: Set Build Config
        id: config
        run: |
          echo "enable_susfs=${{ github.event.inputs.disable_susfs == 'true' && 'false' || 'true' }}" >> $GITHUB_OUTPUT
          echo "force_clean=${{ github.event.inputs.force_clean_build }}" >> $GITHUB_OUTPUT
          echo "create_release=${{ github.event.inputs.create_release }}" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    
    env:
      ENABLE_SUSFS: ${{ needs.setup.outputs.enable_susfs }}
      FORCE_CLEAN: ${{ needs.setup.outputs.force_clean }}
      KSU_VARIANT: ${{ matrix.variant }}

    steps:
      - name: Pre-Clean Build Artifacts
        run: |
          echo "🧹 Cleaning previous build artifacts..."
          rm -rf AnyKernel3 release-assets changelogs || true

      - name: Checkout Workflow Repo
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Build Tools & Dependencies
        run: |
          echo "🔧 Setting up build tools for GitHub Actions..."
          
          # Update package lists
          sudo apt-get update -qq
          
          # Install essential build tools
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang-17 \
            llvm-17 \
            llvm-17-tools \
            lld-17 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            g++-aarch64-linux-gnu \
            g++-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            git \
            curl \
            wget \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            libstdc++-12-dev
          
          # Create symlinks for toolchain
          export CLANG_BIN="/usr/lib/llvm-17/bin"
          export ARM64_TOOLCHAIN="aarch64-linux-gnu-"
          export ARM32_TOOLCHAIN="arm-linux-gnueabihf-"
          
          echo "CLANG_BIN=${CLANG_BIN}" >> $GITHUB_ENV
          echo "ARM64_TOOLCHAIN=${ARM64_TOOLCHAIN}" >> $GITHUB_ENV
          echo "ARM32_TOOLCHAIN=${ARM32_TOOLCHAIN}" >> $GITHUB_ENV
          
          echo "✅ Build tools installed and configured"

      - name: Smart Sync Kernel & SuSFS Sources
        run: |
          echo "📦 Smart syncing kernel and SuSFS sources..."
          
          # 1. Smart Sync Kernel
          if [ -d "kernel/.git" ]; then
            echo "♻️ Existing Kernel tree found. Factory resetting and updating..."
            cd kernel
            git fetch --depth=1 origin android14-6.1-2026-03
            git reset --hard origin/android14-6.1-2026-03
            git clean -fdx
            cd ..
          else
            echo "📥 Downloading Kernel source..."
            git clone --depth=1 --branch=android14-6.1-2026-03 https://android.googlesource.com/kernel/common kernel
          fi
              
          # 2. Smart Sync SuSFS
          if [ -d "susfs4ksu/.git" ]; then
            echo "♻️ Existing SuSFS tree found. Factory resetting and updating..."
            cd susfs4ksu
            git fetch --depth=1 origin gki-android14-6.1-dev
            git reset --hard origin/gki-android14-6.1-dev
            git clean -fdx
            cd ..
          else
            echo "📥 Downloading SuSFS source..."
            git clone --depth=1 --branch=gki-android14-6.1-dev https://gitlab.com/simonpunk/susfs4ksu susfs4ksu
          fi

      - name: Store Commit Info (Workflow, Kernel, SuSFS)
        run: |
          record_commit_info() {
            local prefix="$1"
            local repo_path="$2"
            local short_hash
            local commit_date
            local commit_msg

            short_hash=$(git -C "$repo_path" log -1 --format='%h')
            commit_date=$(git -C "$repo_path" log -1 --format='%cd' --date=format:'%Y-%m-%d %H:%M:%S')
            commit_msg=$(git -C "$repo_path" log -1 --format='%s')

            echo "${prefix}_COMMIT_SHORT=$short_hash" >> "$GITHUB_ENV"
            echo "${prefix}_COMMIT_DATE=$commit_date" >> "$GITHUB_ENV"
            echo "${prefix}_COMMIT_MSG=$commit_msg" >> "$GITHUB_ENV"
          }

          record_commit_info "WORKFLOW" "."
          record_commit_info "KERNEL" "kernel"
          record_commit_info "SUSFS" "susfs4ksu"

      - name: Show CCACHE Status
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -s | grep -E "(Cacheable calls|Hits|Misses|Hit rate|cache size)" || true

      - name: Setup KernelSU Variant
        run: |
          KSU_SETUP_START=$SECONDS
          # Nuke the rogue KernelSU-Next folder as well to clean up the runner
          cd kernel && rm -rf KernelSU drivers/kernelsu KernelSU-Next
          
          case "${{ matrix.variant }}" in
            "tiann") KSU_REPO="tiann/KernelSU"; KSU_BRANCH="main"; USE_SETUP_SH="true" ;;
            "kowsu") KSU_REPO="KOWX712/KernelSU"; KSU_BRANCH="master"; USE_SETUP_SH="true" ;;
            "resukisu") KSU_REPO="ReSukiSU/ReSukiSU"; KSU_BRANCH="main"; USE_SETUP_SH="true" ;;
            "next") KSU_REPO="pershoot/KernelSU-Next"; KSU_BRANCH="dev-susfs"; USE_SETUP_SH="true" ;;
          esac
          
          git clone --depth=1 --branch=$KSU_BRANCH https://github.com/$KSU_REPO.git KernelSU
          
          # We manually integrate KSU to prevent fork setup scripts from rogue cloning
          if [ "$USE_SETUP_SH" = "true" ]; then
            echo "🔗 Manually symlinking KernelSU..."
            ln -sf ../KernelSU/kernel drivers/kernelsu
          else
            echo "📋 Manually copying KernelSU (No symlink)..."
            cp -r KernelSU/kernel drivers/kernelsu
          fi
          
          # Add KSU to kernel makefiles
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          echo "KSU_REPO=$KSU_REPO" >> $GITHUB_ENV && echo "KSU_BRANCH=$KSU_BRANCH" >> $GITHUB_ENV
          echo "KSU_SETUP_TIME=$((SECONDS - KSU_SETUP_START))s" >> $GITHUB_ENV

      - name: Get KSU Version Info & Commit
        run: |
          cd kernel/KernelSU
          git fetch --unshallow --quiet || git fetch --depth=10000 --quiet || true
          
          if [ "${{ matrix.variant }}" = "resukisu" ]; then
            git fetch origin main:main --quiet || true
            KSU_COUNT=$(git rev-list --count main)
            KSU_VERSION=$((40000 + KSU_COUNT - 2815))
          elif [ "${{ matrix.variant }}" = "next" ]; then
            KSU_COUNT=$(git rev-list --count HEAD)
            KSU_VERSION=$((KSU_COUNT + 30000))
          else
            KSU_COUNT=$(git rev-list --count HEAD)
            KSU_VERSION=$((KSU_COUNT + 30000))
          fi
          
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          echo "KSU_COMMIT_SHORT=$(git log -1 --format='%h')" >> $GITHUB_ENV
          echo "KSU_COMMIT_DATE=$(git log -1 --format='%cd' --date=format:'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "KSU_COMMIT_MSG=$(git log -1 --format='%s')" >> $GITHUB_ENV

      - name: Generate Comprehensive Changelog
        if: needs.setup.outputs.create_release == 'true'
        run: |
          mkdir -p changelogs
          CHANGELOG_FILE="changelogs/CHANGELOG-${{ matrix.variant }}.md"
          
          cat << EOF > "$CHANGELOG_FILE"
          # 📋 Comprehensive Build Changelog
          
          **Variant:** ${{ matrix.variant }}
          **Build Number:** #${{ github.run_number }}
          **KernelSU Version:** r${{ env.KSU_VERSION }}
          **SuSFS:** ${{ env.ENABLE_SUSFS == 'true' && 'Enabled' || 'Disabled' }}
          
          ---
          ## 📖 Component Versions
          | Component | Current Commit | Date | Summary |
          |-----------|---------------|------|---------|
          | **KernelSU** | \`${{ env.KSU_COMMIT_SHORT }}\` | ${{ env.KSU_COMMIT_DATE }} | ${{ env.KSU_COMMIT_MSG }} |
          | **Kernel** | \`${{ env.KERNEL_COMMIT_SHORT }}\` | ${{ env.KERNEL_COMMIT_DATE }} | ${{ env.KERNEL_COMMIT_MSG }} |
          | **SuSFS4KSU** | \`${{ env.SUSFS_COMMIT_SHORT }}\` | ${{ env.SUSFS_COMMIT_DATE }} | ${{ env.SUSFS_COMMIT_MSG }} |
          
          ---
          EOF
          
          echo "CHANGELOG_FILE=$CHANGELOG_FILE" >> $GITHUB_ENV

      - name: Setup SuSFS
        if: env.ENABLE_SUSFS == 'true'
        run: |
          apply_patch_or_fail() {
            local patch_file="$1"
            local description="$2"

            if patch -p1 --forward --dry-run < "$patch_file" >/dev/null 2>&1; then
              patch -p1 --forward < "$patch_file"
            elif patch -p1 --reverse --dry-run < "$patch_file" >/dev/null 2>&1; then
              echo "ℹ️ ${description} already present, skipping."
            else
              echo "❌ ${description} could not be applied cleanly: $patch_file"
              exit 1
            fi
          }

          cp susfs4ksu/kernel_patches/fs/susfs.c kernel/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel/include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h kernel/include/linux/
          
          cd kernel
          
          # Apply core SuSFS patch
          VARIANT_SUSFS_PATCH="../.github/patches/${{ matrix.variant }}/50_add_susfs_in_gki-android14-6.1.patch"
          DEFAULT_SUSFS_PATCH="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          
          if [ -f "$VARIANT_SUSFS_PATCH" ]; then
            echo "📋 Applying CUSTOM core SuSFS patch from .github/patches/${{ matrix.variant }}/..."
            apply_patch_or_fail "$VARIANT_SUSFS_PATCH" "Custom core SuSFS patch"
          else
            echo "📋 Applying DEFAULT core SuSFS patch..."
            apply_patch_or_fail "$DEFAULT_SUSFS_PATCH" "Default core SuSFS patch"
          fi
          
          # Apply KSU specific SuSFS patch (Skip for branches with SuSFS pre-integrated)
          if [ "${{ matrix.variant }}" != "resukisu" ]; then
            cd KernelSU
            
            VARIANT_KSU_PATCH="../../.github/patches/${{ matrix.variant }}/10_enable_susfs_for_ksu.patch"
            DEFAULT_KSU_PATCH="../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            
            if [ -f "$VARIANT_KSU_PATCH" ]; then
              echo "📋 Applying CUSTOM 10_enable_susfs_for_ksu patch from .github/patches/${{ matrix.variant }}/..."
              apply_patch_or_fail "$VARIANT_KSU_PATCH" "Custom KernelSU SuSFS patch"
            else
              echo "📋 Applying DEFAULT 10_enable_susfs_for_ksu patch..."
              apply_patch_or_fail "$DEFAULT_KSU_PATCH" "Default KernelSU SuSFS patch"
            fi
            
            # --- NEXT VARIANT FIXES ---
            if [ "${{ matrix.variant }}" = "next" ]; then
              echo "🛠️ Downloading and applying WildKernels SuSFS compilation fixes for KernelSU-Next..."
              WK_URL="https://raw.githubusercontent.com/WildKernels/kernel_patches/main/next/susfs_fix_patches/v2.0.0"

              fetch_patch_or_fail() {
                local url="$1"
                local destination="$2"
                curl --fail --location --silent --show-error "$url" -o "$destination"
              }
              
              fetch_patch_or_fail "$WK_URL/fix_Makefile.patch" fix_Makefile.patch
              fetch_patch_or_fail "$WK_URL/fix_kernel_umount.c.patch" fix_kernel_umount.c.patch
              fetch_patch_or_fail "$WK_URL/fix_ksu.c.patch" fix_ksu.c.patch
              fetch_patch_or_fail "$WK_URL/fix_ksud.c.patch" fix_ksud.c.patch
              fetch_patch_or_fail "$WK_URL/fix_sucompat.c.patch" fix_sucompat.c.patch
              fetch_patch_or_fail "$WK_URL/fix_supercalls.c.patch" fix_supercalls.c.patch
              fetch_patch_or_fail "$WK_URL/ksu_toolkit.patch" ksu_toolkit.patch
              
              apply_patch_or_fail fix_Makefile.patch "WildKernels Makefile fix"
              apply_patch_or_fail fix_kernel_umount.c.patch "WildKernels kernel_umount fix"
              apply_patch_or_fail fix_ksu.c.patch "WildKernels ksu.c fix"
              apply_patch_or_fail fix_ksud.c.patch "WildKernels ksud fix"
              apply_patch_or_fail fix_sucompat.c.patch "WildKernels sucompat fix"
              apply_patch_or_fail fix_supercalls.c.patch "WildKernels supercalls fix"
              apply_patch_or_fail ksu_toolkit.patch "WildKernels toolkit fix"
              
              echo "✅ WildKernels fixes applied successfully!"
            fi
            
          fi

      - name: Apply Remote Patches & Source Fixes
        run: |
          fetch_patch_or_fail() {
            local url="$1"
            local destination="$2"
            curl --fail --location --silent --show-error "$url" -o "$destination"
          }

          apply_patch_or_fail() {
            local patch_file="$1"
            local description="$2"

            if patch -p1 --forward --dry-run < "$patch_file" >/dev/null 2>&1; then
              patch -p1 --forward < "$patch_file"
            elif patch -p1 --reverse --dry-run < "$patch_file" >/dev/null 2>&1; then
              echo "ℹ️ ${description} already present, skipping."
            else
              echo "❌ ${description} could not be applied cleanly: $patch_file"
              exit 1
            fi
          }

          cd kernel
          
          # 0. Bypass GKI ABI symbol checks
          echo "🚫 Removing GKI protected exports..."
          rm -f android/abi_gki_protected_exports_* || true
          
          # 1. CLIDR uninitialized fix
          fetch_patch_or_fail "https://raw.githubusercontent.com/infectedmushi/kernel_patches/main/fix-clidr-uninitialized.patch" /tmp/fix-clidr.patch
          apply_patch_or_fail /tmp/fix-clidr.patch "CLIDR initialization fix"
          
          # 2. Apply Wi-Fi patch (from OnePlus 12 Development)
          echo "📶 Applying Wi-Fi patch..."
          fetch_patch_or_fail "https://github.com/OnePlus-12-Development/android_kernel_qcom_sm8650/commit/3e0cb08.patch" /tmp/wifi-fix.patch
          apply_patch_or_fail /tmp/wifi-fix.patch "Wi-Fi fix"
          
          # 3. Fix KernelSU stack overflow (app_profile.c exceeds 2048 byte limit)
          echo "🔧 Fixing KernelSU stack overflow in app_profile.c..."
          if [ -f "drivers/kernelsu/app_profile.c" ]; then
            # Check if the problematic function exists
            if grep -q "escape_with_root_profile" drivers/kernelsu/app_profile.c; then
              # Replace stack allocation with static to reduce stack frame size
              sed -i '/static void escape_with_root_profile/,/^}/ {
                s/char comm\[TASK_COMM_LEN\];/static char comm[TASK_COMM_LEN];/
              }' drivers/kernelsu/app_profile.c
              echo "✅ Stack overflow fix applied (made comm buffer static)"
            else
              echo "⏭️  Function not found, skipping fix"
            fi
          else
            echo "⏭️  app_profile.c not found, skipping fix"
          fi
          
          # 4. Fix localversion script appending dirty flags
          sed -i '/# Check for uncommitted changes\./,/fi/d' ./scripts/setlocalversion
          
          # 5. Fix libbpf compilation error
          echo "🔧 Patching libbpf.c type casting..."
          sed -i 's/next_path = strchr(s, '"'"':'"'"');/next_path = (char *)strchr(s, '"'"':'"'"');/' tools/lib/bpf/libbpf.c

      - name: Configure Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export PATH="${{ env.CLANG_BIN }}:/usr/lib/ccache:$PATH"
          export CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}"
          export CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}"
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld O=out gki_defconfig
          
          # Append all custom GKI, Tensor G3, Net, and KSU configs via cleanly formatted heredoc
          cat << 'EOF' >> out/.config
          CONFIG_ARM64_CORTEX_X3=y
          CONFIG_ARM64_CORTEX_A715=y
          CONFIG_ARM64_CORTEX_A510=y
          CONFIG_ARM64_VA_BITS=48
          CONFIG_ARM64_PA_BITS=48
          CONFIG_SCHED_MC=y
          CONFIG_SCHED_CORE=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_CPU_FREQ=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_THERMAL=y
          CONFIG_CMA=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_IP_SET=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_KSU=y
          CONFIG_LOCALVERSION="-deepongi+"
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          EOF
          
          if [ "${{ env.ENABLE_SUSFS }}" = "true" ]; then
            cat << 'EOF' >> out/.config
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          EOF
          fi
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld O=out olddefconfig

      - name: Build Kernel (Make)
        run: |
          cd kernel
          export ARCH=arm64
          export PATH="${{ env.CLANG_BIN }}:/usr/lib/ccache:$PATH"
          export CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}"
          export CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CC="ccache clang"
          export CXX="ccache clang++"
          
          MAKE_JOBS=$(nproc)
          START_TIME=$SECONDS
          
          if [ "${{ env.FORCE_CLEAN }}" = "true" ]; then
            make -j$MAKE_JOBS LLVM=1 LLVM_IAS=1 LD=ld.lld O=out clean
          fi
          
          # Crucial Make Command (Exactly as requested)
          make -j$MAKE_JOBS LLVM=1 LLVM_IAS=1 LD=ld.lld HOSTLD=ld.lld O=out CC="$CC"
          
          echo "BUILD_TIME=$((SECONDS - START_TIME))s" >> $GITHUB_ENV

      - name: Package Kernel (AnyKernel3)
        run: |
          cd kernel
          KERNEL_VERSION=$(grep "^VERSION" Makefile | cut -d' ' -f3).$(grep "^PATCHLEVEL" Makefile | cut -d' ' -f3).$(grep "^SUBLEVEL" Makefile | cut -d' ' -f3)
          cd ..
          
          case "${{ matrix.variant }}" in
            "tiann") AK3_BRANCH="KernelSU" ;;
            "kowsu") AK3_BRANCH="KowSU" ;;
            "resukisu") AK3_BRANCH="resukisu" ;;
            "next") AK3_BRANCH="next" ;;
          esac
          
          git clone --depth=1 --branch=$AK3_BRANCH https://github.com/deepongi-labs/AnyKernel3-p8a AnyKernel3 || git clone --depth=1 --branch=main https://github.com/deepongi-labs/AnyKernel3-p8a AnyKernel3
          
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          [ -f kernel/out/arch/arm64/boot/dtb ] && cp kernel/out/arch/arm64/boot/dtb AnyKernel3/
          
          cd AnyKernel3 && rm -rf .git .github
          ZIP_NAME="AK3-${KERNEL_VERSION}-${{ matrix.variant }}-r${{ env.KSU_VERSION }}.zip"
          zip -r9 "../$ZIP_NAME" .
          cd ..
          
          echo "KERNEL_ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}-${{ github.run_number }}
          path: |
            ${{ env.KERNEL_ZIP }}
            ${{ env.CHANGELOG_FILE }}

  create_release:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    if: always() && needs.setup.outputs.create_release == 'true' && needs.build.result != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        run: |
          cd release-assets
          find . -type f -exec mv {} . \; 2>/dev/null || true
          
          # Safety check: Only create release if at least one ZIP was actually built
          if ! ls *.zip 1> /dev/null 2>&1; then
            echo "❌ No ZIP artifacts found! All matrix builds must have failed. Skipping release."
            exit 0
          fi
          
          RELEASE_NOTES="**Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **SuSFS:** ${{ inputs.disable_susfs == true && '❌ Disabled' || '✅ Enabled' }}
          
          ### Devices Supported
          - Pixel 8, 8a, 8 Pro
          
          Flash ZIP in Kernel Flasher or extract Image to patch boot.img manually."
          
          # Added ./*.md to upload the changelogs alongside the zips!
          gh release create "build-${{ github.run_number }}" \
            --title "Android 14 Kernel Build #${{ github.run_number }}" \
            --notes "$RELEASE_NOTES" \
            --repo "${{ github.repository }}" \
            ./*.zip ./*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [setup, create_release, build]
    runs-on: ubuntu-24.04
    if: always() && inputs.enable_telegram && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
    steps:
      - name: Send Telegram Notification
        run: |
          STATUS="${{ needs.build.result }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="⚠️"
          [ "$STATUS" == "failure" ] && ICON="❌"

          # Format variables
          IS_CLEAN="${{ inputs.force_clean_build == true && 'Yes' || 'No' }}"
          IS_SUSFS="${{ inputs.disable_susfs == true && 'Disabled' || 'Enabled' }}"
          DO_REL="${{ inputs.create_release == true && 'Yes' || 'No' }}"
          
          # Use HTML parsing to completely avoid Markdown character breaking (hyphens/underscores)
          cat << EOF > tg_message.txt
          $ICON <b>Kernel Build ${STATUS^^}</b>
          ━━━━━━━━━━━━━━━━━━━━━
          📱 <b>Target:</b> Pixel 8 / 8a / 8 Pro
          🛠️ <b>Variant(s):</b> ${{ inputs.ksu_variant }}
          🛡️ <b>SuSFS:</b> $IS_SUSFS
          🧹 <b>Clean Build:</b> $IS_CLEAN
          📦 <b>Release Created:</b> $DO_REL
          👤 <b>Triggered by:</b> <a href="https://github.com/${{ github.actor }}">${{ github.actor }}</a>
          
          🔗 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Run Logs & Artifacts</a>
          EOF
          
          # Safely URL-encode the file using --data-urlencode text@filename
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text@tg_message.txt \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true
