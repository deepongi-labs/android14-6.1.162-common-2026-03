name: Build GKI Kernel with KernelSU Variants v5.1.0

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU variant to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - tiann
          - kowsu
          - resukisu
          - next
      disable_susfs:
        description: 'Disable SuSFS features'
        required: false
        default: false
        type: boolean
      force_clean_build:
        description: 'Force clean build (ignore cache)'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: true
        type: boolean
      tuning_profile:
        description: 'Pixel 8 tuning profile'
        required: false
        default: 'balanced'
        type: choice
        options:
          - balanced
          - performance
          - battery
      lto_mode:
        description: 'LTO mode (thin/full/none)'
        required: false
        default: 'thin'
        type: choice
        options:
          - thin
          - full
          - none
      governor_mode:
        description: 'CPU governor strategy'
        required: false
        default: 'dynasched'
        type: choice
        options:
          - dynasched
          - stock_schedutil
      kerneltoast_patch_policy:
        description: 'Policy for kerneltoast patchset application (off = recommended; patches drift against android14-6.1)'
        required: false
        default: 'strict'
        type: choice
        options:
          - strict
          - best_effort
          - 'off'
      dry_run_only:
        description: 'Validate source sync and patch application only'
        required: false
        default: false
        type: boolean
      dirty_build:
        description: 'Incremental build: skip source cleanup, preserve out/ directory'
        required: false
        default: false
        type: boolean
      kernel_ref:
        description: 'Override kernel ref'
        required: false
        default: '85a3b1c62eafe7162de570b1b5629a6bb654010d'
        type: string

  workflow_call:
    inputs:
      use_self_hosted:
        required: false
        default: false
        type: boolean
      ksu_variant:
        required: false
        default: 'all'
        type: string
      disable_susfs:
        required: false
        default: false
        type: boolean
      force_clean_build:
        required: false
        default: false
        type: boolean
      enable_telegram:
        required: false
        default: true
        type: boolean
      create_release:
        required: false
        default: true
        type: boolean
      dry_run_only:
        required: false
        default: false
        type: boolean
      dirty_module_abi_bypass:
        required: false
        default: false
        type: boolean
      dirty_build:
        required: false
        default: false
        type: boolean
      refs:
        required: false
        default: ''
        type: string
      build_options:
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: kernel-build-workflow-${{ github.ref_name }}-${{ inputs.ksu_variant || 'all' }}
  cancel-in-progress: false

env:
  # Mirror the local self-hosted toolchain layout used for manual builds.
  CLANG_BIN: /mnt/Hawai/toolchains/Clang-23.0.0git-20260130/bin
  ARM64_TOOLCHAIN: /mnt/Hawai/toolchains/arm-gnu-toolchain-15.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-
  ARM32_TOOLCHAIN: /mnt/Hawai/toolchains/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-
  CCACHE_DIR: /mnt/ccache/.ccache
  SOURCE_MIRROR_DIR: /mnt/Android/source-mirrors
  KERNEL_REPO_URL: https://android.googlesource.com/kernel/common
  SUSFS_REPO_URL: https://gitlab.com/simonpunk/susfs4ksu
  TIANN_REPO_URL: https://github.com/tiann/KernelSU.git
  KOWSU_REPO_URL: https://github.com/KOWX712/KernelSU.git
  RESUKISU_REPO_URL: https://github.com/ReSukiSU/ReSukiSU.git
  NEXT_REPO_URL: https://github.com/KernelSU-Next/KernelSU-Next.git
  ANYKERNEL_REPO_URL: https://github.com/deepongi-labs/AnyKernel3-p8a
  KLAPSE_REPO_URL: https://github.com/tanish2k09/KLapse-Livedisplay
  PATCHES_REPO_SHA: 4cbfb5f8c15acf6b3b797151a54a3a56dc6a843e
  CLIDR_PATCH_URL: https://raw.githubusercontent.com/infectedmushi/kernel_patches/4cbfb5f8c15acf6b3b797151a54a3a56dc6a843e/fix-clidr-uninitialized.patch
  WIFI_PATCH_URL: https://github.com/OnePlus-12-Development/android_kernel_qcom_sm8650/commit/3e0cb08.patch
  KT_PATCH_ARCH_TOPOLOGY_MIN_FREQ_SCALE_URL: https://github.com/kerneltoast/android_kernel_google_tensynos/commit/48a3fd5e41.patch
  KT_PATCH_SCHED_CASS_UCLAMP_PACKING_URL: https://github.com/kerneltoast/android_kernel_google_tensynos/commit/201c5c7c99.patch
  KT_PATCH_SCHEDUTIL_IGNORE_FIE_RATELIMIT_URL: https://github.com/kerneltoast/android_kernel_google_tensynos/commit/56040db35c.patch
  KT_PATCH_SCHEDUTIL_DEFAULT_RATELIMIT_URL: https://github.com/kerneltoast/android_kernel_google_tensynos/commit/627184a51c.patch

jobs:
  setup:
    runs-on: ${{ inputs.use_self_hosted && fromJSON('["self-hosted", "linux", "x64", "pixel8-wsl"]') || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      enable_susfs: ${{ steps.config.outputs.enable_susfs }}
      force_clean: ${{ steps.config.outputs.force_clean }}
      dirty_build: ${{ steps.config.outputs.dirty_build }}
      dry_run: ${{ steps.config.outputs.dry_run }}
      build_start_time: ${{ steps.timestamp.outputs.start_time }}
      create_release: ${{ steps.config.outputs.create_release }}
      kernel_ref: ${{ steps.config.outputs.kernel_ref }}
      susfs_ref: ${{ steps.config.outputs.susfs_ref }}
      tiann_ref: ${{ steps.config.outputs.tiann_ref }}
      kowsu_ref: ${{ steps.config.outputs.kowsu_ref }}
      resukisu_ref: ${{ steps.config.outputs.resukisu_ref }}
      next_ref: ${{ steps.config.outputs.next_ref }}
      tuning_profile: ${{ steps.config.outputs.tuning_profile }}
      lto_mode: ${{ steps.config.outputs.lto_mode }}
      make_jobs: ${{ steps.config.outputs.make_jobs }}
      include_runtime_tuner: ${{ steps.config.outputs.include_runtime_tuner }}
      governor_mode: ${{ steps.config.outputs.governor_mode }}
      kerneltoast_patch_policy: ${{ steps.config.outputs.kerneltoast_patch_policy }}
      dirty_module_abi_bypass: ${{ steps.config.outputs.dirty_module_abi_bypass }}
      stock_boot_img_url: ${{ steps.config.outputs.stock_boot_img_url }}
      stock_boot_gdrive_id: ${{ steps.config.outputs.stock_boot_gdrive_id }}
    steps:
      - name: Record Build Start Time
        id: timestamp
        run: |
          echo "WORKFLOW_START_TIME=$(date +%s)" >> $GITHUB_ENV
          START_TIME=$(date +%s)
          echo "start_time=$START_TIME" >> $GITHUB_OUTPUT
          echo "::notice::Workflow started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set Build Matrix
        id: set-matrix
        run: |
          VARIANT="${{ inputs.ksu_variant }}"
          DISABLE_SUSFS="${{ inputs.disable_susfs }}"

          if [ "$VARIANT" = "all" ]; then
            if [ "$DISABLE_SUSFS" = "true" ]; then
              echo 'matrix={"variant":["tiann","kowsu","resukisu","next"]}' >> $GITHUB_OUTPUT
              echo "🎯 Building all variants with SuSFS disabled"
            else
              echo 'matrix={"variant":["tiann","kowsu","resukisu","next"]}' >> $GITHUB_OUTPUT
              echo "🎯 Building all variants with SuSFS enabled"
            fi
          else
            echo "matrix={\"variant\":[\"$VARIANT\"]}" >> $GITHUB_OUTPUT
            echo "🎯 Building single variant: $VARIANT"
          fi

      - name: Set Build Config
        id: config
        run: |
          # Parse consolidated `refs` and `build_options` string inputs.
          # Format: newline-separated key=value lines. Whitespace around `=` is
          # trimmed. Blank lines and `#`-prefixed lines are ignored. Unknown
          # keys are a hard error.
          KERNEL_REF=""
          SUSFS_REF=""
          TIANN_REF=""
          KOWSU_REF=""
          RESUKISU_REF=""
          NEXT_REF=""
          REFS_INPUT=$(cat <<'__REFS_EOF__'
          ${{ inputs.refs }}
          __REFS_EOF__
          )
          while IFS= read -r line; do
            # Strip leading/trailing whitespace.
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            key="${line%%=*}"
            value="${line#*=}"
            key="${key%"${key##*[![:space:]]}"}"
            key="${key#"${key%%[![:space:]]*}"}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            case "$key" in
              kernel_ref) KERNEL_REF="$value" ;;
              susfs_ref) SUSFS_REF="$value" ;;
              tiann_ref) TIANN_REF="$value" ;;
              kowsu_ref) KOWSU_REF="$value" ;;
              resukisu_ref) RESUKISU_REF="$value" ;;
              next_ref) NEXT_REF="$value" ;;
              *) echo "❌ Unknown key in refs/build_options: $key"; exit 1 ;;
            esac
          done <<< "$REFS_INPUT"

          TUNING_PROFILE=""
          LTO_MODE=""
          MAKE_JOBS=""
          INCLUDE_RUNTIME_TUNER=""
          GOVERNOR_MODE=""
          KERNELTOAST_PATCH_POLICY=""
          DIRTY_MODULE_ABI_BYPASS=""
          STOCK_BOOT_IMG_URL=""
          STOCK_BOOT_GDRIVE_ID=""
          BUILD_OPTIONS_INPUT=$(cat <<'__BUILD_OPTIONS_EOF__'
          ${{ inputs.build_options }}
          __BUILD_OPTIONS_EOF__
          )
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            key="${line%%=*}"
            value="${line#*=}"
            key="${key%"${key##*[![:space:]]}"}"
            key="${key#"${key%%[![:space:]]*}"}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            case "$key" in
              tuning_profile) TUNING_PROFILE="$value" ;;
              lto_mode) LTO_MODE="$value" ;;
              make_jobs) MAKE_JOBS="$value" ;;
              include_runtime_tuner) INCLUDE_RUNTIME_TUNER="$value" ;;
              governor_mode) GOVERNOR_MODE="$value" ;;
              kerneltoast_patch_policy) KERNELTOAST_PATCH_POLICY="$value" ;;
              dirty_module_abi_bypass) DIRTY_MODULE_ABI_BYPASS="$value" ;;
              stock_boot_img_url) STOCK_BOOT_IMG_URL="$value" ;;
              stock_boot_gdrive_id) STOCK_BOOT_GDRIVE_ID="$value" ;;
              *) echo "❌ Unknown key in refs/build_options: $key"; exit 1 ;;
            esac
          done <<< "$BUILD_OPTIONS_INPUT"

          ENABLE_SUSFS="${{ inputs.disable_susfs && 'false' || 'true' }}"
          echo "enable_susfs=${ENABLE_SUSFS}" >> $GITHUB_OUTPUT
          echo "force_clean=${{ inputs.force_clean_build }}" >> $GITHUB_OUTPUT
          echo "dirty_build=${{ inputs.dirty_build }}" >> $GITHUB_OUTPUT
          echo "dry_run=${{ inputs.dry_run_only }}" >> $GITHUB_OUTPUT
          echo "create_release=${{ inputs.create_release && !inputs.dry_run_only && 'true' || 'false' }}" >> $GITHUB_OUTPUT
          echo "kernel_ref=${KERNEL_REF:-85a3b1c62eafe7162de570b1b5629a6bb654010d}" >> $GITHUB_OUTPUT
          echo "susfs_ref=${SUSFS_REF:-gki-android14-6.1-dev}" >> $GITHUB_OUTPUT
          echo "tiann_ref=${TIANN_REF:-0544f475962fd7f27d27ae24a7ab3ee2a8d7538a}" >> $GITHUB_OUTPUT
          echo "kowsu_ref=${KOWSU_REF:-master}" >> $GITHUB_OUTPUT
          echo "resukisu_ref=${RESUKISU_REF:-main}" >> $GITHUB_OUTPUT
          # Default to upstream KernelSU-Next 'dev' branch.
          # SuSFS patches are fetched from simonpunk/susfs4ksu gki-android14-6.1-dev
          # and WildKernels v2.1.0 fixers, so upstream dev branch works directly.
          RESOLVED_NEXT_REF="${NEXT_REF:-dev}"
          echo "next_ref=${RESOLVED_NEXT_REF}" >> $GITHUB_OUTPUT
          case "$TUNING_PROFILE" in
            balanced|performance|battery) ;;
          esac

          LTO_MODE="${LTO_MODE:-thin}"
          case "$LTO_MODE" in
            thin|full|none) ;;
            *) echo "❌ Invalid lto_mode: $LTO_MODE"; exit 1 ;;
          esac
          echo "lto_mode=$LTO_MODE" >> $GITHUB_OUTPUT

          MAKE_JOBS_INPUT="${MAKE_JOBS:-auto}"
          if [ "$MAKE_JOBS_INPUT" = "auto" ] || [[ "$MAKE_JOBS_INPUT" =~ ^[1-9][0-9]*$ ]]; then
            echo "make_jobs=$MAKE_JOBS_INPUT" >> $GITHUB_OUTPUT
          else
            echo "❌ Invalid make_jobs: $MAKE_JOBS_INPUT (expected auto or integer >= 1)"
            exit 1
          fi

          if [ -z "$INCLUDE_RUNTIME_TUNER" ]; then
            INCLUDE_RUNTIME_TUNER="true"
          fi
          case "$INCLUDE_RUNTIME_TUNER" in
            true|false) ;;
            *) echo "❌ Invalid include_runtime_tuner: $INCLUDE_RUNTIME_TUNER (expected true or false)"; exit 1 ;;
          esac
          echo "include_runtime_tuner=$INCLUDE_RUNTIME_TUNER" >> $GITHUB_OUTPUT

          GOVERNOR_MODE_INPUT="${GOVERNOR_MODE:-dynasched}"
          case "$GOVERNOR_MODE_INPUT" in
            dynasched|pixel8_dynamic_schedutil)
              GOVERNOR_MODE_INPUT="dynasched"
              ;;
            stock_schedutil) ;;
            *) echo "❌ Invalid governor_mode: $GOVERNOR_MODE_INPUT"; exit 1 ;;
          esac
          echo "governor_mode=$GOVERNOR_MODE_INPUT" >> $GITHUB_OUTPUT

          KERNELTOAST_PATCH_POLICY="${KERNELTOAST_PATCH_POLICY:-best_effort}"
          case "$KERNELTOAST_PATCH_POLICY" in
            strict|best_effort|off) ;;
            *) echo "❌ Invalid kerneltoast_patch_policy: $KERNELTOAST_PATCH_POLICY"; exit 1 ;;
          esac
          echo "kerneltoast_patch_policy=$KERNELTOAST_PATCH_POLICY" >> $GITHUB_OUTPUT

          DIRTY_MODULE_ABI_BYPASS="${DIRTY_MODULE_ABI_BYPASS:-true}"
          case "$DIRTY_MODULE_ABI_BYPASS" in
            true|false) ;;
            *) echo "❌ Invalid dirty_module_abi_bypass: $DIRTY_MODULE_ABI_BYPASS (expected true or false)"; exit 1 ;;
          esac
          echo "dirty_module_abi_bypass=$DIRTY_MODULE_ABI_BYPASS" >> $GITHUB_OUTPUT

          STOCK_BOOT_IMG_URL="${STOCK_BOOT_IMG_URL:-https://filebin.net/kspfgod8qsyhpk66/stock-akita-cp1a.260505.005.a1.img}"

          # stock_boot_img_url: optional, must be https:// or empty
          if [ -n "$STOCK_BOOT_IMG_URL" ]; then
            case "$STOCK_BOOT_IMG_URL" in
              https://*) ;;
              *) echo "❌ stock_boot_img_url must start with https://"; exit 1 ;;
            esac
          fi
          if [ -n "$STOCK_BOOT_GDRIVE_ID" ]; then
            case "$STOCK_BOOT_GDRIVE_ID" in
              https://drive.google.com/file/d/*)
                STOCK_BOOT_GDRIVE_ID="${STOCK_BOOT_GDRIVE_ID#*file/d/}"
                STOCK_BOOT_GDRIVE_ID="${STOCK_BOOT_GDRIVE_ID%%/*}"
                ;;
              https://drive.google.com/open?id=*)
                STOCK_BOOT_GDRIVE_ID="${STOCK_BOOT_GDRIVE_ID#*id=}"
                STOCK_BOOT_GDRIVE_ID="${STOCK_BOOT_GDRIVE_ID%%&*}"
                ;;
            esac
          fi
          echo "stock_boot_img_url=$STOCK_BOOT_IMG_URL" >> $GITHUB_OUTPUT
          echo "stock_boot_gdrive_id=$STOCK_BOOT_GDRIVE_ID" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ${{ inputs.use_self_hosted && fromJSON('["self-hosted", "linux", "x64", "pixel8-wsl"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    concurrency:
      group: kernel-build-job-${{ github.ref_name }}-${{ matrix.variant }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      ENABLE_SUSFS: ${{ needs.setup.outputs.enable_susfs }}
      FORCE_CLEAN: ${{ needs.setup.outputs.force_clean }}
      DIRTY_BUILD: ${{ needs.setup.outputs.dirty_build }}
      DRY_RUN_ONLY: ${{ needs.setup.outputs.dry_run }}
      KSU_VARIANT: ${{ matrix.variant }}
      TUNING_PROFILE: ${{ needs.setup.outputs.tuning_profile }}
      LTO_MODE: ${{ needs.setup.outputs.lto_mode }}
      MAKE_JOBS_OVERRIDE: ${{ needs.setup.outputs.make_jobs }}
      RUNTIME_TUNER: ${{ needs.setup.outputs.include_runtime_tuner }}
      GOVERNOR_MODE: ${{ needs.setup.outputs.governor_mode }}
      KERNELTOAST_PATCH_POLICY: ${{ needs.setup.outputs.kerneltoast_patch_policy }}
      DIRTY_MODULE_ABI_BYPASS: ${{ needs.setup.outputs.dirty_module_abi_bypass }}
      STOCK_BOOT_IMG_URL: ${{ needs.setup.outputs.stock_boot_img_url }}
      STOCK_BOOT_GDRIVE_ID: ${{ needs.setup.outputs.stock_boot_gdrive_id }}

    steps:
      - name: Pre-Clean Build Artifacts
        run: |
          echo "🧹 Cleaning previous build artifacts..."
          rm -rf AnyKernel3 release-assets changelogs logs failure-logs success-metadata || true

      - name: Checkout Workflow Repo
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Setup Build Tools & Dependencies
        run: |
          set -e
          echo "::group::Runner Sanity"
          mkdir -p "${{ env.SOURCE_MIRROR_DIR }}" 2>/dev/null || true
          df -h .
          df -h /mnt/ccache 2>/dev/null || true
          echo "CPU cores: $(nproc)"
          echo "::endgroup::"

          echo "::group::Toolchain Detection"
          echo "🔧 Resolving build tools for self-hosted runner..."

          if [ -x "/mnt/Hawai/toolchains/Clang-23.0.0git-20260130/bin/clang" ] && [ -d "/mnt/Hawai/toolchains" ]; then
            export CLANG_BIN="/mnt/Hawai/toolchains/Clang-23.0.0git-20260130/bin"
            export ARM64_TOOLCHAIN="/mnt/Hawai/toolchains/arm-gnu-toolchain-15.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-"
            export ARM32_TOOLCHAIN="/mnt/Hawai/toolchains/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-"
            export TOOLCHAIN_ID="clang23-gnu15.2"
            echo "Using local self-hosted toolchains."
          else
            echo "Falling back to distro toolchains from PATH."
            export CLANG_BIN="/usr/lib/llvm-17/bin"
            export ARM64_TOOLCHAIN="aarch64-linux-gnu-"
            export ARM32_TOOLCHAIN="arm-linux-gnueabihf-"
            export TOOLCHAIN_ID="llvm17-distro"
          fi

          echo "CLANG_BIN=${CLANG_BIN}" >> $GITHUB_ENV
          echo "ARM64_TOOLCHAIN=${ARM64_TOOLCHAIN}" >> $GITHUB_ENV
          echo "ARM32_TOOLCHAIN=${ARM32_TOOLCHAIN}" >> $GITHUB_ENV
          echo "TOOLCHAIN_ID=${TOOLCHAIN_ID}" >> $GITHUB_ENV

          RUNNER_THREADS="$(nproc)"
          BUILD_JOBS="$RUNNER_THREADS"
          BUILD_LOAD="$((RUNNER_THREADS + 1))"
          BUILD_TMPDIR="/mnt/ccache/kernel-tmp"
          if ! mkdir -p "$BUILD_TMPDIR" 2>/dev/null; then
            BUILD_TMPDIR="/mnt/Android/kernel-tmp"
            mkdir -p "$BUILD_TMPDIR"
          fi
          echo "RUNNER_THREADS=${RUNNER_THREADS}" >> $GITHUB_ENV
          echo "BUILD_JOBS=${BUILD_JOBS}" >> $GITHUB_ENV
          echo "BUILD_LOAD=${BUILD_LOAD}" >> $GITHUB_ENV
          echo "TMPDIR=${BUILD_TMPDIR}" >> $GITHUB_ENV
          echo "TEMP=${BUILD_TMPDIR}" >> $GITHUB_ENV
          echo "TMP=${BUILD_TMPDIR}" >> $GITHUB_ENV
          echo "MAKEFLAGS=-j${BUILD_JOBS} -l${BUILD_LOAD}" >> $GITHUB_ENV

          if [ -d "/mnt/ccache" ] && mkdir -p /mnt/ccache/.ccache 2>/dev/null; then
            SELECTED_CCACHE_DIR="/mnt/ccache/.ccache"
          else
            SELECTED_CCACHE_DIR="$HOME/.ccache"
            mkdir -p "$SELECTED_CCACHE_DIR"
          fi

          echo "CCACHE_DIR=${SELECTED_CCACHE_DIR}" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          echo "CCACHE_NOHASHDIR=true" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=mtime" >> $GITHUB_ENV
          echo "CCACHE_NOCOMPRESS=true" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=45G" >> $GITHUB_ENV
          echo "CCACHE_HARDLINK=true" >> $GITHUB_ENV
          echo "CCACHE_FILECLONE=true" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=file_macro,include_file_mtime,include_file_ctime,time_macros,locale,pch_defines,include_file_macro" >> $GITHUB_ENV
          echo "CCACHE_TEMPDIR=${SELECTED_CCACHE_DIR}/tmp" >> $GITHUB_ENV

          # Help cache hits across different checkout paths on self-hosted runners.
          mkdir -p "${SELECTED_CCACHE_DIR}/tmp"
          ccache --set-config=base_dir="${GITHUB_WORKSPACE}" >/dev/null 2>&1 || true
          ccache --set-config=hash_dir=false >/dev/null 2>&1 || true
          ccache --set-config=compiler_check=mtime >/dev/null 2>&1 || true
          ccache --set-config=compression=false >/dev/null 2>&1 || true
          ccache --set-config=hard_link=true >/dev/null 2>&1 || true
          ccache --set-config=file_clone=true >/dev/null 2>&1 || true
          ccache --set-config=sloppiness=file_macro,include_file_mtime,include_file_ctime,time_macros,locale,pch_defines,include_file_macro >/dev/null 2>&1 || true
          ccache --set-config=temporary_dir="${SELECTED_CCACHE_DIR}/tmp" >/dev/null 2>&1 || true
          ccache -M 45G >/dev/null 2>&1 || true

          command -v git >/dev/null
          command -v curl >/dev/null
          command -v patch >/dev/null
          command -v make >/dev/null
          command -v ccache >/dev/null
          command -v "${CLANG_BIN}/clang" >/dev/null 2>&1 || command -v clang >/dev/null
          test -x "${CLANG_BIN}/clang" || command -v clang >/dev/null
          command -v pahole >/dev/null || { echo "⚠️ pahole not found, installing dwarves..."; sudo apt-get update -qq && sudo apt-get install -y dwarves; }
          test -w "${SELECTED_CCACHE_DIR}"
          test -w "${BUILD_TMPDIR}"

          echo "✅ Build tools configured: jobs=${BUILD_JOBS}, load=${BUILD_LOAD}, tmp=${BUILD_TMPDIR}, ccache=${SELECTED_CCACHE_DIR}"
          echo "::endgroup::"

      - name: Cache ccache
        if: ${{ !startsWith(env.CCACHE_DIR, '/mnt/ccache') }}
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-
            ccache-${{ runner.os }}-

      - name: Static analysis (shellcheck)
        run: |
          if command -v shellcheck >/dev/null; then
            find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck || true
          else
            echo "shellcheck not installed; skipping"
          fi

      - name: Smart Sync Kernel & SuSFS Sources
        run: |
          set -e
          sync_repo_shallow() {
            local name="$1"
            local url="$2"
            local ref="$3"
            local target="$4"

            echo "::group::Sync ${name}"

            # If target is a submodule gitlink or has stale .git/modules entry, nuke it
            if [ -f "${target}/.git" ]; then
              echo "⚠️ ${target} is a submodule gitlink; removing for standalone sync"
              rm -rf "$target"
              rm -rf ".git/modules/${target}" 2>/dev/null || true
            fi

            if [ -d "${target}/.git" ]; then
              if [ "${{ needs.setup.outputs.dirty_build }}" = "true" ]; then
                echo "♻️ DIRTY_BUILD=true: keeping existing ${target} checkout ($(git -C "$target" rev-parse --short HEAD))"
                echo "::endgroup::"
                return 0
              fi

              git -C "$target" remote set-url origin "$url"
              # Clean working tree FIRST to avoid checkout conflicts from previously applied patches
              if [ "${{ needs.setup.outputs.dirty_build }}" != "true" ]; then
                git -C "$target" reset --hard HEAD
                git -C "$target" clean -fdx
              fi
              git -C "$target" fetch --depth=1 origin "$ref"
              git -C "$target" checkout FETCH_HEAD
              if [ "${{ needs.setup.outputs.dirty_build }}" != "true" ]; then
                git -C "$target" reset --hard FETCH_HEAD
                git -C "$target" clean -fdx
              fi
            else
              rm -rf "$target"
              rm -rf ".git/modules/${target}" 2>/dev/null || true
              # Try branch first, fall back to commit SHA
              if git ls-remote --heads "$url" "$ref" | grep -q "$ref"; then
                git clone --depth=1 --branch="$ref" "$url" "$target"
              else
                git clone "$url" "$target"
                git -C "$target" fetch origin "$ref"
                git -C "$target" checkout "$ref"
              fi
              git -C "$target" checkout --detach
            fi

            echo "${name} -> $(git -C "$target" rev-parse --short HEAD)"
            echo "::endgroup::"
          }

          echo "📦 Smart syncing kernel and SuSFS sources..."

          # Avoid full mirrors here: kernel/common is huge and mirror fetches are slow.
          sync_repo_shallow "kernel-common" "${{ env.KERNEL_REPO_URL }}" "${{ needs.setup.outputs.kernel_ref }}" "kernel"
          sync_repo_shallow "susfs4ksu" "${{ env.SUSFS_REPO_URL }}" "${{ needs.setup.outputs.susfs_ref }}" "susfs4ksu"

      - name: Store Commit Info (Workflow, Kernel, SuSFS)
        run: |
          set -e
          record_commit_info() {
            local prefix="$1"
            local repo_path="$2"
            local short_hash
            local commit_date
            local commit_msg

            short_hash=$(git -C "$repo_path" log -1 --format='%h')
            commit_date=$(git -C "$repo_path" log -1 --format='%cd' --date=format:'%Y-%m-%d %H:%M:%S')
            commit_msg=$(git -C "$repo_path" log -1 --format='%s')

            echo "${prefix}_COMMIT_SHORT=$short_hash" >> "$GITHUB_ENV"
            echo "${prefix}_COMMIT_DATE=$commit_date" >> "$GITHUB_ENV"
            echo "${prefix}_COMMIT_MSG=$commit_msg" >> "$GITHUB_ENV"
          }

          record_commit_info "WORKFLOW" "."
          record_commit_info "KERNEL" "kernel"
          record_commit_info "SUSFS" "susfs4ksu"

      - name: Show CCACHE Status
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -s | grep -E "(Cacheable calls|Hits|Misses|Hit rate|cache size)" || true

      - name: Reset CCACHE Counters
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -z || true

      - name: Setup KernelSU Variant
        run: |
          set -e
          KSU_SETUP_START=$SECONDS
          sync_variant_repo() {
            local name="$1"
            local url="$2"
            local ref="$3"
            local target="$4"
            local mirror="${SOURCE_MIRROR_DIR}/${name}.git"

            if [ -d "$mirror" ]; then
              # Check if the mirror points to the correct upstream URL
              local current_url
              current_url=$(git -C "$mirror" remote get-url origin 2>/dev/null || echo "")
              if [ "$current_url" != "$url" ]; then
                echo "⚠️ Mirror URL mismatch for ${name}: '${current_url}' != '${url}'"
                echo "   Deleting stale mirror and re-cloning..."
                rm -rf "$mirror"
              fi
            fi

            if [ ! -d "$mirror" ]; then
              git clone --mirror "$url" "$mirror"
            else
              git -C "$mirror" fetch --prune origin
            fi

            if [ "${{ needs.setup.outputs.dirty_build }}" = "true" ] && [ -d "$target/.git" ]; then
              echo "♻️ DIRTY_BUILD=true: keeping existing ${target} checkout ($(git -C "$target" rev-parse --short HEAD))"
              return 0
            fi

            rm -rf "$target"
            git clone --reference-if-able "$mirror" "$mirror" "$target"
            git -C "$target" fetch --depth=1 origin "$ref"
            git -C "$target" checkout --detach FETCH_HEAD
          }

          # Clean any prior KSU artifacts from the kernel tree (legacy KernelSU/ folder,
          # symlinks, and integrated drivers/kernelsu/) plus the workspace-level staging dir.
          if [ "${{ needs.setup.outputs.dirty_build }}" != "true" ]; then
            rm -rf kernel/KernelSU kernel/KernelSU-Next kernel/drivers/kernelsu
            rm -rf "${GITHUB_WORKSPACE}/.ksu-src"
          else
            echo "♻️ DIRTY_BUILD=true: preserving existing KernelSU staging and integrated tree"
          fi

          case "${{ matrix.variant }}" in
            # 'enhance' uses Tiann KernelSU with Pixel 8 optimizations.
            "enhance") KSU_REPO="${{ env.TIANN_REPO_URL }}"; KSU_BRANCH="${{ needs.setup.outputs.tiann_ref }}" ;;
            "tiann") KSU_REPO="${{ env.TIANN_REPO_URL }}"; KSU_BRANCH="${{ needs.setup.outputs.tiann_ref }}" ;;
            "kowsu") KSU_REPO="${{ env.KOWSU_REPO_URL }}"; KSU_BRANCH="${{ needs.setup.outputs.kowsu_ref }}" ;;
            "resukisu") KSU_REPO="${{ env.RESUKISU_REPO_URL }}"; KSU_BRANCH="${{ needs.setup.outputs.resukisu_ref }}" ;;
            "next") KSU_REPO="${{ env.NEXT_REPO_URL }}"; KSU_BRANCH="${{ needs.setup.outputs.next_ref }}" ;;
          esac

          # For tiann/enhance, use official setup.sh script
          if [ "${{ matrix.variant }}" = "tiann" ] || [ "${{ matrix.variant }}" = "enhance" ]; then
            echo "::group::Setup Tiann KernelSU via official script"
            cd kernel
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_BRANCH"
            cd ..
            KSU_STAGE="${GITHUB_WORKSPACE}/kernel/KernelSU"
            echo "Tiann KernelSU setup complete via official script"
            echo "KSU_REPO=$KSU_REPO" >> $GITHUB_ENV
            echo "KSU_BRANCH=$KSU_BRANCH" >> $GITHUB_ENV
            echo "KSU_STAGE=$KSU_STAGE" >> $GITHUB_ENV
            echo "::endgroup::"
          else
          # Clone the KSU source tree to a workspace-local staging dir OUTSIDE the
          # kernel tree. The kernel/ subdirectory will later be copied directly into
          # kernel/drivers/kernelsu/ by the "Integrate KernelSU into kernel tree" step,
          # after all KSU-side patches have been applied. This keeps the kernel/ tree
          # free of any auxiliary KernelSU/ folder.
          KSU_STAGE="${GITHUB_WORKSPACE}/.ksu-src"
          echo "::group::Sync KernelSU Variant"
          sync_variant_repo "ksu-${{ matrix.variant }}" "$KSU_REPO" "$KSU_BRANCH" "$KSU_STAGE"
          echo "KernelSU repo:    $KSU_REPO"
          echo "KernelSU ref:     $KSU_BRANCH"
          echo "Staged at:        $KSU_STAGE"
          echo "::endgroup::"

          if [ ! -d "$KSU_STAGE/kernel" ]; then
            echo "❌ ${KSU_STAGE}/kernel directory not found after clone"
            ls -la "$KSU_STAGE" || true
            exit 1
          fi

          echo "KSU_REPO=$KSU_REPO" >> $GITHUB_ENV
          echo "KSU_BRANCH=$KSU_BRANCH" >> $GITHUB_ENV
          echo "KSU_SETUP_TIME=$((SECONDS - KSU_SETUP_START))s" >> $GITHUB_ENV
          fi

      - name: Get KSU Version Info & Commit
        run: |
          cd "${KSU_STAGE:-${GITHUB_WORKSPACE}/.ksu-src}"
          git fetch --unshallow --quiet || git fetch --depth=10000 --quiet || true

          if [ "${{ matrix.variant }}" = "resukisu" ]; then
            KSU_COUNT=$(git rev-list --count HEAD)
            KSU_VERSION=$((40000 + KSU_COUNT - 2815))
          elif [ "${{ matrix.variant }}" = "next" ]; then
            KSU_COUNT=$(git rev-list --count HEAD)
            KSU_VERSION=$((KSU_COUNT + 30000))
          else
            KSU_COUNT=$(git rev-list --count HEAD)
            KSU_VERSION=$((KSU_COUNT + 30000))
          fi

          KSU_COMMIT_SHORT=$(git log -1 --format='%h')
          KSU_VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-${KSU_COMMIT_SHORT}")

          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          echo "KSU_VERSION_TAG=$KSU_VERSION_TAG" >> $GITHUB_ENV
          echo "KSU_COMMIT_SHORT=$KSU_COMMIT_SHORT" >> $GITHUB_ENV
          echo "KSU_COMMIT_DATE=$(git log -1 --format='%cd' --date=format:'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "KSU_COMMIT_MSG=$(git log -1 --format='%s')" >> $GITHUB_ENV

      - name: Generate Comprehensive Changelog
        run: |
          set -e
          mkdir -p changelogs
          CHANGELOG_FILE="changelogs/CHANGELOG-${{ matrix.variant }}.md"

          cat << EOF > "$CHANGELOG_FILE"
          # 📋 Comprehensive Build Changelog

          **Variant:** ${{ matrix.variant }}
          **Build Number:** #${{ github.run_number }}
          **KernelSU Version:** r${{ env.KSU_VERSION }}
          **SuSFS:** ${{ env.ENABLE_SUSFS == 'true' && 'Enabled' || 'Disabled' }}

          ---
          ## 📖 Component Versions
          | Component | Current Commit | Date | Summary |
          |-----------|---------------|------|---------|
          | **KernelSU** | \`${{ env.KSU_COMMIT_SHORT }}\` | ${{ env.KSU_COMMIT_DATE }} | ${{ env.KSU_COMMIT_MSG }} |
          | **Kernel** | \`${{ env.KERNEL_COMMIT_SHORT }}\` | ${{ env.KERNEL_COMMIT_DATE }} | ${{ env.KERNEL_COMMIT_MSG }} |
          | **SuSFS4KSU** | \`${{ env.SUSFS_COMMIT_SHORT }}\` | ${{ env.SUSFS_COMMIT_DATE }} | ${{ env.SUSFS_COMMIT_MSG }} |

          ---
          EOF

          echo "CHANGELOG_FILE=$CHANGELOG_FILE" >> $GITHUB_ENV

      - name: Setup SuSFS
        if: env.ENABLE_SUSFS == 'true'
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/logs"
          PATCH_MANIFEST="$GITHUB_WORKSPACE/logs/patch-manifest-${KSU_VARIANT}.txt"
          PATCH_FAILURE_LOG="$GITHUB_WORKSPACE/logs/patch-failure-${KSU_VARIANT}.log"
          : > "$PATCH_MANIFEST"
          : > "$PATCH_FAILURE_LOG"

          log_patch_failure() {
            local patch_file="$1"
            local description="$2"
            local temp_log

            temp_log="$(mktemp)"
            patch -p1 --forward --dry-run < "$patch_file" >"$temp_log" 2>&1 || true

            {
              echo "=== ${description} ==="
              echo "Patch: $patch_file"
              cat "$temp_log"
              echo
            } >> "$PATCH_FAILURE_LOG"

            rm -f "$temp_log"
          }

          apply_patch_or_fail() {
            local patch_file="$1"
            local description="$2"

            if patch -p1 --forward --dry-run < "$patch_file" >/dev/null 2>&1; then
              patch -p1 --forward < "$patch_file"
              printf '%s | %s | applied\n' "$description" "$patch_file" >> "$PATCH_MANIFEST"
            elif patch -p1 --reverse --dry-run < "$patch_file" >/dev/null 2>&1; then
              echo "ℹ️ ${description} already present, skipping."
              printf '%s | %s | already-present\n' "$description" "$patch_file" >> "$PATCH_MANIFEST"
            elif patch -p1 --forward --fuzz=3 --dry-run < "$patch_file" >/dev/null 2>&1; then
              echo "📋 Applying patch with fuzz=3: $description"
              patch -p1 --forward --fuzz=3 < "$patch_file"
              printf '%s | %s | applied-fuzz\n' "$description" "$patch_file" >> "$PATCH_MANIFEST"
            elif git apply --3way --check "$patch_file" >/dev/null 2>&1; then
              echo "📋 Applying patch with 3-way merge: $description"
              git apply --3way "$patch_file"
              printf '%s | %s | applied-3way\n' "$description" "$patch_file" >> "$PATCH_MANIFEST"
            else
              echo "❌ ${description} could not be applied cleanly: $patch_file"
              printf '%s | %s | failed\n' "$description" "$patch_file" >> "$PATCH_MANIFEST"
              log_patch_failure "$patch_file" "$description"
              echo "📝 Patch failure log: $PATCH_FAILURE_LOG"
              exit 1
            fi
          }

          apply_variant_or_default_patch() {
            local variant_patch="$1"
            local default_patch="$2"
            local variant_desc="$3"
            local default_desc="$4"

            # Auto-detect patch strip level (-p0 vs -p1)
            patch_already_present() {
              local patch_file="$1"
              local strip_level="$2"
              local temp_log

              temp_log="$(mktemp)"
              patch -p${strip_level} --forward --dry-run < "$patch_file" >"$temp_log" 2>&1 || true
              if grep -q 'Reversed (or previously applied) patch detected' "$temp_log"; then
                rm -f "$temp_log"
                return 0
              fi
              rm -f "$temp_log"
              return 1
            }

            detect_strip_level() {
              local patch_file="$1"
              if patch -p1 --forward --dry-run < "$patch_file" >/dev/null 2>&1 \
                || patch_already_present "$patch_file" "1"; then
                echo "1"
              elif patch -p0 --forward --dry-run < "$patch_file" >/dev/null 2>&1 \
                || patch_already_present "$patch_file" "0"; then
                echo "0"
              else
                echo "-1"
              fi
            }

            if [ -f "$variant_patch" ]; then
              STRIP_LEVEL=$(detect_strip_level "$variant_patch")
              if [ "$STRIP_LEVEL" = "-1" ]; then
                if git apply --3way --check "$variant_patch" >/dev/null 2>&1; then
                  echo "📋 Applying CUSTOM patch with 3-way merge: $variant_desc"
                  git apply --3way "$variant_patch"
                  printf '%s | %s | applied-3way\n' "$variant_desc" "$variant_patch" >> "$PATCH_MANIFEST"
                  return 0
                fi
                echo "⚠️ Custom patch is stale, falling back to default: $variant_patch"
                printf '%s | %s | stale-fallback\n' "$variant_desc" "$variant_patch" >> "$PATCH_MANIFEST"
                log_patch_failure "$variant_patch" "$variant_desc"
              elif patch_already_present "$variant_patch" "$STRIP_LEVEL"; then
                echo "ℹ️ ${variant_desc} already present, skipping."
                printf '%s | %s | already-present\n' "$variant_desc" "$variant_patch" >> "$PATCH_MANIFEST"
                return 0
              else
                echo "📋 Applying CUSTOM patch: $variant_desc"
                patch -p${STRIP_LEVEL} --forward < "$variant_patch"
                printf '%s | %s | applied-p%s\n' "$variant_desc" "$variant_patch" "$STRIP_LEVEL" >> "$PATCH_MANIFEST"
                return 0
              fi
            fi

            STRIP_LEVEL=$(detect_strip_level "$default_patch")
            if [ "$STRIP_LEVEL" = "-1" ]; then
              if git apply --3way --check "$default_patch" >/dev/null 2>&1; then
                echo "📋 Applying DEFAULT patch with 3-way merge: $default_desc"
                git apply --3way "$default_patch"
                printf '%s | %s | applied-3way\n' "$default_desc" "$default_patch" >> "$PATCH_MANIFEST"
                return 0
              fi
              echo "❌ ${default_desc} could not be applied cleanly: $default_patch"
              printf '%s | %s | failed\n' "$default_desc" "$default_patch" >> "$PATCH_MANIFEST"
              log_patch_failure "$default_patch" "$default_desc"
              echo "📝 Patch failure log: $PATCH_FAILURE_LOG"
              exit 1
            elif patch_already_present "$default_patch" "$STRIP_LEVEL"; then
              echo "ℹ️ ${default_desc} already present, skipping."
              printf '%s | %s | already-present\n' "$default_desc" "$default_patch" >> "$PATCH_MANIFEST"
              return 0
            else
              echo "📋 Applying DEFAULT patch: $default_desc"
              patch -p${STRIP_LEVEL} --forward < "$default_patch"
              printf '%s | %s | applied-p%s\n' "$default_desc" "$default_patch" "$STRIP_LEVEL" >> "$PATCH_MANIFEST"
              return 0
            fi
          }

          ensure_namespace_trace_hook_include() {
            if grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c 2>/dev/null; then
              printf '%s | %s | already-present\n' "Namespace trace hook include" "fs/namespace.c" >> "$PATCH_MANIFEST"
              return 0
            fi

            printf '%s\n' \
              'from pathlib import Path' \
              'path = Path("fs/namespace.c")' \
              'text = path.read_text()' \
              'marker = "#include \"internal.h\"\n"' \
              'insert = "#include \"internal.h\"\n#include <trace/hooks/blk.h>\n"' \
              'if marker not in text: raise SystemExit("namespace.c layout drifted; could not inject trace/hooks include")' \
              'path.write_text(text.replace(marker, insert, 1))' \
              | python -

            printf '%s | %s | applied\n' "Namespace trace hook include" "fs/namespace.c" >> "$PATCH_MANIFEST"
          }

          auto_merge_tiann_ksu_susfs_patch() {
            printf '%s\n' \
              'import re' \
              'from pathlib import Path' \
              'def replace_once(path_str, old, new):' \
              '    path = Path(path_str)' \
              '    text = path.read_text()' \
              '    if old not in text: raise SystemExit(f"missing expected conflict block in {path_str}")' \
              '    path.write_text(text.replace(old, new, 1))' \
              'def replace_re(path_str, pattern, new):' \
              '    path = Path(path_str)' \
              '    text = path.read_text()' \
              '    updated, count = re.subn(pattern, new, text, count=1, flags=re.S)' \
              '    if count != 1: raise SystemExit(f"missing expected conflict pattern in {path_str}")' \
              '    path.write_text(updated)' \
              'replace_once("kernel/Kbuild", """<<<<<<< ours\nifeq ($(filter /%,$(src)),)\nKSU_KERNEL_DIR := $(srctree)/$(src)\nelse\nKSU_KERNEL_DIR := $(src)\nendif\n=======\n## As we are building gki only, no KBUILD_EXTMOD is needed\n## Since there is still a build error for 6.12 as $(src) returns absolute path, so here we just hardcode it\nccflags-y += -I$(srctree)/drivers/kernelsu -I$(srctree)/drivers/kernelsu/include\n>>>>>>> theirs\n""", """## As we are building gki only, no KBUILD_EXTMOD is needed\n## Since there is still a build error for 6.12 as $(src) returns absolute path, so here we just hardcode it\nccflags-y += -I$(srctree)/drivers/kernelsu -I$(srctree)/drivers/kernelsu/include\n""")' \
              'replace_once("kernel/Kbuild", """\nccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include\n""", "\n")' \
              'replace_re("kernel/core/init.c", r"<<<<<<< ours\n#include \"hook/syscall_hook_manager\.h\"\n#include \"hook/lsm_hook\.h\"\n=======\n>>>>>>> theirs\n", "")' \
              'replace_re("kernel/core/init.c", r"<<<<<<< ours\n\s*ksu_init_symbol_resolver\(\);\n\s*ksu_syscall_hook_init\(\);\n\s*\n\s*ksu_feature_init\(\);\n\s*ksu_sulog_init\(\);\n\s*ksu_adb_root_init\(\);\n\s*ksu_lsm_hook_init\(\);\n\s*ksu_selinux_hide_init\(\);\n=======\n\s*ksu_feature_init\(\);\n>>>>>>> theirs\n", "    ksu_feature_init();\n")' \
              'replace_re("kernel/feature/kernel_umount.c", r"<<<<<<< ours\n.*?=======\n>>>>>>> theirs\n", "")' \
              'replace_re("kernel/policy/app_profile.c", r"<<<<<<< ours\n\s*struct task_struct \*p = current;\n\s*struct task_struct \*t;\n\s*struct root_profile \*profile = NULL;\n=======\n\s*struct root_profile profile;\n>>>>>>> theirs\n", "    struct root_profile *profile = NULL;\n")' \
              'replace_re("kernel/policy/app_profile.c", r"<<<<<<< ours\n\s*for_each_thread \(p, t\) \{\n\s*ksu_set_task_tracepoint_flag\(t\);\n\s*\}\n\s*\n\s*setup_mount_ns\(profile->namespaces\);\n\s*ksu_put_root_profile\(profile\);\n=======\n\s*setup_mount_ns\(profile\.namespaces\);\n>>>>>>> theirs\n", "    setup_mount_ns(profile->namespaces);\n    ksu_put_root_profile(profile);\n")' \
              | python -

            if grep -R "<<<<<<<\|>>>>>>>" -n kernel >/tmp/ksu-susfs-conflicts.txt; then
              head /tmp/ksu-susfs-conflicts.txt
              echo "❌ Unresolved conflicts remain after tiann/enhance KernelSU SuSFS auto-merge"
              exit 1
            fi

            git add kernel/Kbuild kernel/core/init.c kernel/feature/kernel_umount.c kernel/policy/app_profile.c
          }

          # Reset kernel and KernelSU trees to clean state before SuSFS patching
          echo "🧹 Resetting kernel tree for clean SuSFS patch application..."
          cd "${GITHUB_WORKSPACE}/kernel"
          git reset --hard HEAD
          git clean -fdx
          cd "${KSU_STAGE:-${GITHUB_WORKSPACE}/.ksu-src}"
          git reset --hard HEAD
          git clean -fdx
          cd "${GITHUB_WORKSPACE}"

          # Copy SuSFS source files per upstream instructions
          echo "📋 Copying SuSFS source files..."
          cp susfs4ksu/kernel_patches/fs/susfs.c kernel/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel/include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h kernel/include/linux/

          # Copy patches into target directories per pershoot instructions
          echo "📋 Copying SuSFS patches to target directories..."
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch kernel/
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch "${KSU_STAGE:-${GITHUB_WORKSPACE}/.ksu-src}/"

          cd kernel

          # Apply core SuSFS patch.
          VARIANT_SUSFS_PATCH="../.github/patches/${KSU_VARIANT}/50_add_susfs_in_gki-android14-6.1.patch"
          DEFAULT_SUSFS_PATCH="./50_add_susfs_in_gki-android14-6.1.patch"

          if [ "$KSU_VARIANT" = "tiann" ] || [ "$KSU_VARIANT" = "enhance" ]; then
            echo "📋 Enforcing default-only core SuSFS patch for ${KSU_VARIANT}"
            # Apply with partial success allowed (namespace.c hunk #1 will fail)
            echo "📋 Applying core SuSFS patch (partial OK for namespace.c)..."
            patch -p1 < "$DEFAULT_SUSFS_PATCH" || true

            # Apply namespace fix for failed hunk #1
            if [ -f fs/namespace.c.rej ]; then
              echo "📋 Applying namespace.c fix for tiann/enhance..."
              patch -p1 < ../.github/patches/common/namespace_fix_for_tiann.patch
              ../scripts/susfs_namespace_patcher.py fs/namespace.c --no-backup || true
              rm -f fs/namespace.c.rej
              printf '%s | %s | applied\n' "Namespace fix for tiann" "../.github/patches/common/namespace_fix_for_tiann.patch + ../scripts/susfs_namespace_patcher.py" >> "$PATCH_MANIFEST"
            fi

            # Verify no other rejects remain
            if find . -name '*.rej' -print -quit | grep -q .; then
              echo "❌ Unexpected patch rejects found after namespace fix:"
              find . -name '*.rej' -exec echo "  {}" \; -exec cat {} \;
              exit 1
            fi

            printf '%s | %s | applied-partial+fix\n' "Default core SuSFS patch" "$DEFAULT_SUSFS_PATCH" >> "$PATCH_MANIFEST"
          elif [ "$KSU_VARIANT" = "kowsu" ]; then
            apply_patch_or_fail "$VARIANT_SUSFS_PATCH" "Custom core SuSFS patch"
          else
            # Variants without a strict core-patch policy use variant-first fallback.
            apply_variant_or_default_patch \
              "$VARIANT_SUSFS_PATCH" \
              "$DEFAULT_SUSFS_PATCH" \
              "Custom core SuSFS patch" \
              "Default core SuSFS patch"
          fi

          # Always attempt the KernelSU-side SuSFS integration patch.
          # Some upstream variants drift over time; the helper will skip cleanly
          # when the integration is already present.
          cd "${KSU_STAGE:-${GITHUB_WORKSPACE}/.ksu-src}"

          VARIANT_KSU_PATCH="${GITHUB_WORKSPACE}/.github/patches/${KSU_VARIANT}/10_enable_susfs_for_ksu.patch"
          DEFAULT_KSU_PATCH="./10_enable_susfs_for_ksu.patch"
          SUSFS_RUNTIME_ENABLED=true

          ksu_susfs_integrated() {
            grep -q 'config KSU_SUSFS' kernel/Kconfig 2>/dev/null \
              || grep -q 'KSU_SUSFS' kernel/Makefile 2>/dev/null \
              || grep -q 'KSU_SUSFS' kernel/Kbuild 2>/dev/null
          }

          try_apply_patch() {
            local patch_file="$1"
            local desc="$2"

            if patch -p1 --forward --dry-run < "$patch_file" >/dev/null 2>&1; then
              echo "📋 Applying patch: $desc"
              patch -p1 --forward < "$patch_file"
              printf '%s | %s | applied\n' "$desc" "$patch_file" >> "$PATCH_MANIFEST"
              return 0
            elif patch -p1 --reverse --dry-run < "$patch_file" >/dev/null 2>&1; then
              echo "ℹ️ ${desc} already present, skipping."
              printf '%s | %s | already-present\n' "$desc" "$patch_file" >> "$PATCH_MANIFEST"
              return 0
            fi

            return 1
          }

          if ksu_susfs_integrated; then
            echo "ℹ️ KernelSU SuSFS integration appears present; skipping patch application."
            printf '%s | %s | already-present\n' "KernelSU SuSFS integration" "kernel/(Kconfig|Makefile|Kbuild)" >> "$PATCH_MANIFEST"
          elif [ "$KSU_VARIANT" = "next" ]; then
            echo "🔍 Checking optional KernelSU-Next SuSFS integration (variant=${KSU_VARIANT})..."
            if [ -f "$VARIANT_KSU_PATCH" ] && try_apply_patch "$VARIANT_KSU_PATCH" "KernelSU-Next custom SuSFS patch"; then
              :
            elif try_apply_patch "$DEFAULT_KSU_PATCH" "KernelSU-Next default SuSFS patch"; then
              :
            elif ksu_susfs_integrated; then
              echo "ℹ️ KernelSU-Next already contains SuSFS integration."
              printf '%s | %s | already-present\n' "KernelSU-Next SuSFS integration" "kernel/(Kconfig|Makefile|Kbuild)" >> "$PATCH_MANIFEST"
            else
              echo "ℹ️ KernelSU-Next uses WildKernels SuSFS patches; skipping legacy KernelSU-side patch."
              printf '%s | %s | skipped-next-wildkernel\n' "KernelSU-Next legacy SuSFS integration" "$DEFAULT_KSU_PATCH" >> "$PATCH_MANIFEST"
            fi
          elif [ "$KSU_VARIANT" = "tiann" ] || [ "$KSU_VARIANT" = "enhance" ]; then
            echo "📋 Enforcing default-only KernelSU SuSFS patch for ${KSU_VARIANT}"
            if ! try_apply_patch "$DEFAULT_KSU_PATCH" "Default KernelSU SuSFS patch"; then
              if git apply --3way "$DEFAULT_KSU_PATCH"; then
                echo "📋 Applied Default KernelSU SuSFS patch with 3-way merge"
                printf '%s | %s | applied-3way\n' "Default KernelSU SuSFS patch" "$DEFAULT_KSU_PATCH" >> "$PATCH_MANIFEST"
              else
                echo "📋 Resolving Default KernelSU SuSFS patch 3-way conflicts for ${KSU_VARIANT}"
                auto_merge_tiann_ksu_susfs_patch
                printf '%s | %s | applied-3way-automerge\n' "Default KernelSU SuSFS patch" "$DEFAULT_KSU_PATCH" >> "$PATCH_MANIFEST"
              fi

              if ksu_susfs_integrated; then
                echo "ℹ️ KernelSU SuSFS integration appears present; skipping patch application."
                printf '%s | %s | verified-present\n' "KernelSU SuSFS integration" "kernel/(Kconfig|Makefile|Kbuild)" >> "$PATCH_MANIFEST"
              else
                echo "❌ Default KernelSU SuSFS patch could not be applied cleanly: $DEFAULT_KSU_PATCH"
                printf '%s | %s | failed\n' "Default KernelSU SuSFS patch" "$DEFAULT_KSU_PATCH" >> "$PATCH_MANIFEST"
                exit 1
              fi
            fi
          elif [ -f "$VARIANT_KSU_PATCH" ]; then
            if ! try_apply_patch "$VARIANT_KSU_PATCH" "Custom KernelSU SuSFS patch"; then
              echo "⚠️ Custom KernelSU SuSFS patch is stale, falling back to default: $VARIANT_KSU_PATCH"
              printf '%s | %s | stale-fallback\n' "Custom KernelSU SuSFS patch" "$VARIANT_KSU_PATCH" >> "$PATCH_MANIFEST"
              if ! try_apply_patch "$DEFAULT_KSU_PATCH" "Default KernelSU SuSFS patch"; then
                if ksu_susfs_integrated; then
                  echo "ℹ️ KernelSU SuSFS integration appears present; skipping patch application."
                  printf '%s | %s | already-present\n' "KernelSU SuSFS integration" "kernel/(Kconfig|Makefile|Kbuild)" >> "$PATCH_MANIFEST"
                else
                  echo "❌ Default KernelSU SuSFS patch could not be applied cleanly: $DEFAULT_KSU_PATCH"
                  printf '%s | %s | failed\n' "Default KernelSU SuSFS patch" "$DEFAULT_KSU_PATCH" >> "$PATCH_MANIFEST"
                  exit 1
                fi
              fi
            fi
          else
            if ! try_apply_patch "$DEFAULT_KSU_PATCH" "Default KernelSU SuSFS patch"; then
              if ksu_susfs_integrated; then
                echo "ℹ️ KernelSU SuSFS integration appears present; skipping patch application."
                printf '%s | %s | already-present\n' "KernelSU SuSFS integration" "kernel/(Kconfig|Makefile|Kbuild)" >> "$PATCH_MANIFEST"
              else
                echo "❌ Default KernelSU SuSFS patch could not be applied cleanly: $DEFAULT_KSU_PATCH"
                printf '%s | %s | failed\n' "Default KernelSU SuSFS patch" "$DEFAULT_KSU_PATCH" >> "$PATCH_MANIFEST"
                exit 1
              fi
            fi
          fi

          # Ensure selinux_hide compatibility symbols exist for all variants.
          # Older KernelSU trees keep them in feature/selinux_hide.c; current Tiann
          # trees do not ship that feature file, so provide disabled symbols in
          # selinux.c to satisfy the kernel-side SuSFS manual hooks.
          echo "🔧 Ensuring selinux_hide symbols have global linkage..."
          printf '%s\n' \
            'from pathlib import Path' \
            'feature = Path("kernel/feature/selinux_hide.c")' \
            'selinux = Path("kernel/selinux/selinux.c")' \
            'if feature.exists():' \
            '    text = feature.read_text()' \
            '    changed = False' \
            '    if "static struct selinux_state fake_state;" in text:' \
            '        text = text.replace("static struct selinux_state fake_state;", "struct selinux_state fake_state;", 1)' \
            '        changed = True' \
            '    if "static bool ksu_selinux_hide_running" in text:' \
            '        text = text.replace("static bool ksu_selinux_hide_running", "bool ksu_selinux_hide_running", 1)' \
            '        changed = True' \
            '    if changed:' \
            '        feature.write_text(text)' \
            '        print("✅ selinux_hide.c: promoted static symbols to global")' \
            '    else:' \
            '        print("ℹ️  selinux_hide.c: symbols already global or file layout differs")' \
            'elif selinux.exists():' \
            '    text = selinux.read_text()' \
            '    if "ksu_selinux_hide_running" not in text and "struct selinux_state fake_state" not in text:' \
            '        marker = "u32 ksu_file_sid __read_mostly = 0;\n"' \
            '        compat = marker + "\n#ifdef CONFIG_KSU_SUSFS\nstruct selinux_state fake_state;\nbool ksu_selinux_hide_running __read_mostly = false;\n#endif\n"' \
            '        if marker not in text:' \
            '            raise SystemExit("kernel/selinux/selinux.c layout drifted; could not add selinux_hide compatibility symbols")' \
            '        selinux.write_text(text.replace(marker, compat, 1))' \
            '        print("✅ selinux.c: added disabled selinux_hide compatibility symbols")' \
            '    else:' \
            '        print("ℹ️  selinux_hide compatibility symbols already present")' \
            'else:' \
            '    raise SystemExit("KernelSU SELinux sources not found; cannot satisfy selinux_hide symbols")' \
            | python3 -

          if [ "$KSU_VARIANT" = "enhance" ]; then
            ENHANCE_SPOOF_PATCH="${GITHUB_WORKSPACE}/.github/patches/enhance/20-KernelSU-Spoof-LKM-mode-to-suppress-manager-warning.patch"
            if ! try_apply_patch "$ENHANCE_SPOOF_PATCH" "Enhance KernelSU manager compatibility spoof"; then
              echo "⚠️ Enhance manager compatibility spoof patch is stale, skipping: $ENHANCE_SPOOF_PATCH"
              printf '%s | %s | skipped-stale\n' "Enhance KernelSU manager compatibility spoof" "$ENHANCE_SPOOF_PATCH" >> "$PATCH_MANIFEST"
            fi
          fi

          if [ "$KSU_VARIANT" = "next" ] && [ -f fix_susfs.py ]; then
            python3 fix_susfs.py
            printf '%s | %s | applied\n' "KernelSU-Next repo susfs fixer" "fix_susfs.py" >> "$PATCH_MANIFEST"
          fi

          if [ "$KSU_VARIANT" = "tiann" ] || [ "$KSU_VARIANT" = "kowsu" ] || [ "$KSU_VARIANT" = "enhance" ]; then
            printf '%s\n' \
              'from pathlib import Path' \
              'target = Path("kernel/hook/setuid_hook.c")' \
              'if target.exists():' \
              '    text = target.read_text()' \
              '    if "susfs_run_sus_path_loop();" in text:' \
              '        target.write_text(text.replace("susfs_run_sus_path_loop();", "(void)0; /* symbol not available in this variant */"))' \
              | python -
            printf '%s | %s | applied\n' "Disable missing sus_path loop call (tiann/kowsu/enhance)" "kernel/hook/setuid_hook.c" >> "$PATCH_MANIFEST"
          fi

          echo "PATCH_MANIFEST=$PATCH_MANIFEST" >> "$GITHUB_ENV"
          echo "PATCH_FAILURE_LOG=$PATCH_FAILURE_LOG" >> "$GITHUB_ENV"

      - name: Inject SuSFS Kconfig for KernelSU-Next
        if: env.ENABLE_SUSFS == 'true' && env.KSU_VARIANT == 'next'
        run: |
          set -e
          KSU_KCONFIG="${KSU_STAGE}/kernel/Kconfig"

          if ! grep -q 'config KSU_SUSFS' "$KSU_KCONFIG" 2>/dev/null; then
            echo "⚠️  CONFIG_KSU_SUSFS missing from Kconfig, injecting for KernelSU-Next..."

            cat << 'KCONFIGEOF' | sed 's/^          //' >> "$KSU_KCONFIG"

          menu "KernelSU - SUSFS"
          config KSU_SUSFS
          bool "KernelSU addon - SUSFS"
          depends on KSU
          default y

          config KSU_SUSFS_SUS_PATH
          bool "Enable to hide suspicious path"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_SUS_MOUNT
          bool "Enable to hide suspicious mounts"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_SUS_KSTAT
          bool "Enable to spoof suspicious kstat"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_TRY_UMOUNT
          bool "Enable to use ksu's try_umount"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_SPOOF_UNAME
          bool "Enable to spoof uname"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_ENABLE_LOG
          bool "Enable logging susfs log to kernel"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          bool "Enable to hide ksu/susfs symbols"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          bool "Enable to spoof /proc/bootconfig or /proc/cmdline"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_OPEN_REDIRECT
          bool "Enable to redirect path opens"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_SUS_MAP
          bool "Enable to hide mmapped files from proc maps"
          depends on KSU_SUSFS
          default y

          endmenu
          KCONFIGEOF

            echo "✅ Injected SuSFS Kconfig entries"
            printf '%s | %s | injected\n' "KernelSU-Next SuSFS Kconfig" "$KSU_KCONFIG" >> "$PATCH_MANIFEST"
          else
            echo "✅ CONFIG_KSU_SUSFS already present in Kconfig"
          fi

      - name: Validate SuSFS Integration
        if: env.ENABLE_SUSFS == 'true'
        run: |
          set -e
          echo "::group::SuSFS Integration Validation"

          VALIDATION_ERRORS=0

          # Check kernel-side SuSFS sources.
          if [ ! -f kernel/fs/susfs.c ]; then
            echo "::error::ENABLE_SUSFS=true but kernel/fs/susfs.c missing. Core SuSFS patch may have failed silently."
            VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
          else
            echo "✅ kernel/fs/susfs.c present"
          fi

          if [ ! -f kernel/include/linux/susfs.h ]; then
            echo "::error::ENABLE_SUSFS=true but kernel/include/linux/susfs.h missing."
            VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
          else
            echo "✅ kernel/include/linux/susfs.h present"
          fi

          # Check KernelSU-side SuSFS integration.
          KSU_STAGE="${KSU_STAGE:-${GITHUB_WORKSPACE}/.ksu-src}"
          if [ "$KSU_VARIANT" = "next" ]; then
            echo "ℹ️ Skipping CONFIG_KSU_SUSFS check for KernelSU-Next (uses WildKernels integration)"
          elif ! grep -q 'config KSU_SUSFS' "$KSU_STAGE/kernel/Kconfig" 2>/dev/null \
            && ! grep -q 'KSU_SUSFS' "$KSU_STAGE/kernel/Makefile" 2>/dev/null \
            && ! grep -q 'KSU_SUSFS' "$KSU_STAGE/kernel/Kbuild" 2>/dev/null; then
            echo "::error::ENABLE_SUSFS=true but CONFIG_KSU_SUSFS not found in KernelSU Kconfig/Makefile/Kbuild. Integration patch may have failed."
            VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
          else
            echo "✅ KernelSU SuSFS integration present"
          fi

          if [ "$KSU_VARIANT" = "next" ]; then
            echo "⚠️ Skipping optional Brene CMD_SUSFS_* handler checks for ${KSU_VARIANT}"
          else
            for required_cmd in \
              CMD_SUSFS_SHOW_ENABLED_FEATURES \
              CMD_SUSFS_SHOW_VERSION \
              CMD_SUSFS_SHOW_VARIANT; do
              if ! grep -Rqs "$required_cmd" "$KSU_STAGE/kernel"; then
                echo "::error::ENABLE_SUSFS=true but $required_cmd handler is missing from KernelSU supercall path. Brene cannot query SuSFS."
                VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
              fi
            done
          fi

          if [ "$KSU_VARIANT" = "next" ]; then
            echo "⚠️ Skipping optional susfs_get_enabled_features check for ${KSU_VARIANT}"
          elif ! grep -Rqs 'susfs_get_enabled_features' "$KSU_STAGE/kernel"; then
            echo "::error::ENABLE_SUSFS=true but susfs_get_enabled_features bridge is missing from KernelSU. Brene cannot load enabled features."
            VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
          elif ! grep -Rqs 'susfs_get_susfs_version' "$KSU_STAGE/kernel" && ! grep -Rqs 'susfs_get_version' "$KSU_STAGE/kernel"; then
            echo "::warning::SuSFS version command exists but no obvious version helper name was found; continuing because patch may inline the version copy."
          else
            echo "✅ KernelSU SuSFS Brene query bridge present"
          fi

          # Check patch manifest for silent disables.
          if [ -f "$PATCH_MANIFEST" ]; then
            DISABLED_COUNT=$(grep -c '| disabled$' "$PATCH_MANIFEST" 2>/dev/null || true)
            DISABLED_COUNT="${DISABLED_COUNT:-0}"
            if [ "$DISABLED_COUNT" -gt 0 ]; then
              echo "::error::$DISABLED_COUNT SuSFS patch(es) were auto-disabled. Check patch-manifest-${KSU_VARIANT}.txt for details."
              grep '| disabled$' "$PATCH_MANIFEST" || true
              VALIDATION_ERRORS=$((VALIDATION_ERRORS + DISABLED_COUNT))
            fi
          fi

          if [ "$VALIDATION_ERRORS" -gt 0 ]; then
            echo "::endgroup::"
            echo "::error::$VALIDATION_ERRORS SuSFS integration check(s) failed. Check patch-manifest-${KSU_VARIANT}.txt for patch failures."
            exit 1
          fi

          echo "✅ SuSFS integration validation passed"
          echo "::endgroup::"

      - name: Integrate KernelSU into kernel tree
        run: |
          set -e
          KSU_STAGE="${KSU_STAGE:-${GITHUB_WORKSPACE}/.ksu-src}"
          if [ ! -d "$KSU_STAGE/kernel" ]; then
            echo "❌ ${KSU_STAGE}/kernel missing; cannot integrate KernelSU."
            exit 1
          fi

          # Place patched KernelSU sources at drivers/kernelsu/. Use a symlink
          # into the staged repo so Kbuild can read the variant-specific Kconfig
          # and KernelSU-Next can discover .git metadata.
          rm -rf kernel/drivers/kernelsu
          mkdir -p kernel/drivers
          ln -s "$KSU_STAGE/kernel" kernel/drivers/kernelsu
          test -f kernel/drivers/kernelsu/Kconfig

          # KernelSU-Next keeps public headers outside kernel/ and links
          # kernel/include/uapi back to that repo-root uapi directory. Once
          # kernel/ is linked under drivers/kernelsu, that symlink may point at
          # the wrong tree from the kernel build path, so replace it with copied
          # headers in the staged source before building.
          if [ -d "$KSU_STAGE/uapi" ]; then
            rm -rf "$KSU_STAGE/kernel/uapi" "$KSU_STAGE/kernel/include/uapi"
            mkdir -p "$KSU_STAGE/kernel/uapi"
            cp -a "$KSU_STAGE/uapi/." "$KSU_STAGE/kernel/uapi/"
            mkdir -p "$KSU_STAGE/kernel/include/uapi"
            cp -a "$KSU_STAGE/uapi/." "$KSU_STAGE/kernel/include/uapi/"
          elif [ -e "$KSU_STAGE/kernel/include/uapi" ]; then
            rm -rf "$KSU_STAGE/kernel/include/uapi.real"
            mkdir -p "$KSU_STAGE/kernel/include/uapi.real"
            cp -aL "$KSU_STAGE/kernel/include/uapi/." "$KSU_STAGE/kernel/include/uapi.real/"
            rm -rf "$KSU_STAGE/kernel/include/uapi"
            mv "$KSU_STAGE/kernel/include/uapi.real" "$KSU_STAGE/kernel/include/uapi"
          fi

          # KernelSU-Next Kbuild can miss git metadata when built from a linked
          # source under the kernel tree. Force sane fallback values from the
          # staged repo so Manager never sees KSU_VERSION=1 / tag=v0.0.1.
          if [ -f kernel/drivers/kernelsu/Kbuild ]; then
            python -c 'from pathlib import Path; import sys; version, tag = sys.argv[1], sys.argv[2]; p = Path("kernel/drivers/kernelsu/Kbuild"); text = p.read_text(); text = text.replace("KSU_VERSION_FALLBACK := 1", f"KSU_VERSION_FALLBACK := {version}"); text = text.replace("KSU_VERSION_TAG_FALLBACK := v0.0.1", f"KSU_VERSION_TAG_FALLBACK := {tag}"); p.write_text(text)' "$KSU_VERSION" "$KSU_VERSION_TAG"
            echo "✅ KernelSU-Next Kbuild fallback metadata: version=${KSU_VERSION}, tag=${KSU_VERSION_TAG}"
          fi
          echo "✅ KernelSU integrated at kernel/drivers/kernelsu (source: $KSU_STAGE)"

          # Wire kernelsu/ into the upstream drivers Kbuild + Kconfig (idempotent).
          if ! grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' kernel/drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> kernel/drivers/Makefile
            echo "  + drivers/Makefile: obj-\$(CONFIG_KSU) += kernelsu/"
          fi
          if ! grep -Fq 'source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig
            echo "  + drivers/Kconfig: source drivers/kernelsu/Kconfig"
          fi

      - name: Apply Remote Patches & Source Fixes
        run: |
          set -e
          fetch_patch_or_fail() {
            local url="$1"
            local destination="$2"
            curl --fail --location --silent --show-error "$url" -o "$destination"
          }

          apply_patch_or_fail() {
            local patch_file="$1"
            local description="$2"

            if patch -p1 --forward --dry-run < "$patch_file" >/dev/null 2>&1; then
              patch -p1 --forward < "$patch_file"
            elif patch -p1 --reverse --dry-run < "$patch_file" >/dev/null 2>&1; then
              echo "ℹ️ ${description} already present, skipping."
            elif git apply --3way --check "$patch_file" >/dev/null 2>&1; then
              echo "📋 Applying patch with 3-way merge: $description"
              git apply --3way "$patch_file"
            else
              echo "❌ ${description} could not be applied cleanly: $patch_file"
              exit 1
            fi
          }

          apply_repo_patch_or_fail() {
            local patch_file="$1"
            local description="$2"
            apply_patch_or_fail "$GITHUB_WORKSPACE/$patch_file" "$description"
          }

          apply_remote_patch_with_policy() {
            local url="$1"
            local local_name="$2"
            local description="$3"

            local destination="/tmp/${local_name}"
            if ! curl --fail --location --silent --show-error "$url" -o "$destination"; then
              if [ "${KERNELTOAST_PATCH_POLICY}" = "strict" ]; then
                echo "❌ ${description} download failed in strict mode: ${url}"
                exit 1
              fi
              echo "⚠️  Skipping ${description}: failed to download ${url}"
              return 0
            fi
            if [ ! -s "$destination" ]; then
              if [ "${KERNELTOAST_PATCH_POLICY}" = "strict" ]; then
                echo "❌ ${description} downloaded empty patch in strict mode: ${url}"
                exit 1
              fi
              echo "⚠️  Skipping ${description}: downloaded empty patch from ${url}"
              return 0
            fi

            if [ "${KERNELTOAST_PATCH_POLICY}" = "strict" ]; then
              if git apply --check "$destination" >/dev/null 2>&1; then
                git apply "$destination"
                echo "✅ Applied ${description}"
                printf '%s | %s | applied-strict\n' "$description" "$url" >> "${PATCH_MANIFEST:-/dev/null}"
                return 0
              fi
              if git apply --reverse --check "$destination" >/dev/null 2>&1; then
                echo "ℹ️ ${description} already present, skipping."
                printf '%s | %s | already-present-strict\n' "$description" "$url" >> "${PATCH_MANIFEST:-/dev/null}"
                return 0
              fi
              echo "❌ ${description} failed strict git apply check: ${url}"
              echo "::group::${description} strict apply diagnostics"
              git apply --check --verbose "$destination" || true
              echo "::endgroup::"
              exit 1
            fi

            if patch -p1 --forward --dry-run < "$destination" >/dev/null 2>&1; then
              patch -p1 --forward < "$destination"
              echo "✅ Applied ${description}"
              printf '%s | %s | applied\n' "$description" "$url" >> "${PATCH_MANIFEST:-/dev/null}"
            elif patch -p1 --reverse --dry-run < "$destination" >/dev/null 2>&1; then
              echo "ℹ️ ${description} already present, skipping."
              printf '%s | %s | already-present\n' "$description" "$url" >> "${PATCH_MANIFEST:-/dev/null}"
            elif git apply --3way --check "$destination" >/dev/null 2>&1; then
              echo "📋 Applying patch with 3-way merge: $description"
              git apply --3way "$destination"
              echo "✅ Applied ${description} via 3-way merge"
              printf '%s | %s | applied-3way\n' "$description" "$url" >> "${PATCH_MANIFEST:-/dev/null}"
            else
              if [ "${KERNELTOAST_PATCH_POLICY}" = "strict" ]; then
                echo "❌ ${description} failed to apply cleanly in strict mode"
                exit 1
              fi
              echo "⚠️  Skipping ${description}: patch drift against current kernel ref"
              printf '%s | %s | skipped-stale\n' "$description" "$url" >> "${PATCH_MANIFEST:-/dev/null}"
            fi
          }

          cd kernel

          # 0. GKI ABI symbol checks: keep stripped on akita.
          # Background: removing android/abi_gki_protected_exports_* lets the
          # kernel add new EXPORT_SYMBOLs without ABI-hash check failures.
          # On Pixel 8 (akita) Wi-Fi (BCM4389) the vendor module needs symbols
          # that aren't in the protected list, so leaving the file in place
          # blocks Wi-Fi module load. We strip by default; opt out by setting
          # KEEP_PROTECTED_EXPORTS=true if/when the underlying symbol is
          # added to the GKI protected ABI properly.
          if [ "${KEEP_PROTECTED_EXPORTS:-false}" = "true" ]; then
            echo "🔒 Keeping android/abi_gki_protected_exports_* (KEEP_PROTECTED_EXPORTS=true)"
          else
            echo "🚫 Removing GKI protected exports (akita Wi-Fi BCM4389 workaround)..."
            rm -f android/abi_gki_protected_exports_* || true
          fi

          # 1. CLIDR uninitialized fix (use local copy, not a remote SHA-pinned URL)
          apply_repo_patch_or_fail ".github/patches/fix-clidr-uninitialized.patch" "CLIDR initialization fix"

          # 2. (Optional) Wi-Fi patch from OnePlus 12 (Qualcomm SM8650 tree)
          # Tensor G3 (Pixel 8, akita) uses Broadcom BCM4389 Wi-Fi, NOT QCA.
          # The 3-way fallback in apply_patch_or_fail can land hunks in the wrong
          # place on a foreign WLAN driver, panicking on first wpa_supplicant up.
          # Disabled by default; opt in with apply_oneplus12_wifi_patch=true.
          if [ "${APPLY_ONEPLUS12_WIFI_PATCH:-false}" = "true" ]; then
            echo "📶 Applying OnePlus 12 (SM8650) Wi-Fi patch (opt-in)..."
            fetch_patch_or_fail "${{ env.WIFI_PATCH_URL }}" /tmp/wifi-fix.patch
            if [ -s /tmp/wifi-fix.patch ]; then echo "✅ Wi-Fi patch downloaded"; else echo "❌ Wi-Fi patch missing"; exit 1; fi
            apply_patch_or_fail /tmp/wifi-fix.patch "Wi-Fi fix"
          else
            echo "⏭️  OnePlus 12 (SM8650) Wi-Fi patch skipped: incompatible with Pixel 8 (BCM4389)"
          fi

          # 2b. Apply selected kerneltoast 16.0.0-sultan optimizations.
          if [ "${KERNELTOAST_PATCH_POLICY}" != "off" ]; then
            echo "🚀 Applying selected kerneltoast scheduler/power commits (${KERNELTOAST_PATCH_POLICY})..."
            KERNELTOAST_APPLIED_COUNT=0
            apply_remote_patch_with_policy "${{ env.KT_PATCH_ARCH_TOPOLOGY_MIN_FREQ_SCALE_URL }}" "kt-arch-topology-min-freq-scale.patch" "kerneltoast: arch_topology minimum frequency scale"
            KERNELTOAST_APPLIED_COUNT=$((KERNELTOAST_APPLIED_COUNT + 1))
            apply_remote_patch_with_policy "${{ env.KT_PATCH_SCHED_CASS_UCLAMP_PACKING_URL }}" "kt-sched-cass-uclamp-packing.patch" "kerneltoast: sched/cass uclamp packing threshold"
            KERNELTOAST_APPLIED_COUNT=$((KERNELTOAST_APPLIED_COUNT + 1))
            apply_remote_patch_with_policy "${{ env.KT_PATCH_SCHEDUTIL_IGNORE_FIE_RATELIMIT_URL }}" "kt-schedutil-ignore-fie-ratelimit.patch" "kerneltoast: schedutil ignore FIE rate-limit on scale-up"
            KERNELTOAST_APPLIED_COUNT=$((KERNELTOAST_APPLIED_COUNT + 1))
            apply_remote_patch_with_policy "${{ env.KT_PATCH_SCHEDUTIL_DEFAULT_RATELIMIT_URL }}" "kt-schedutil-default-ratelimit.patch" "kerneltoast: schedutil default rate-limit 2000us"
            KERNELTOAST_APPLIED_COUNT=$((KERNELTOAST_APPLIED_COUNT + 1))
            if [ "${KERNELTOAST_PATCH_POLICY}" = "strict" ] && [ "$KERNELTOAST_APPLIED_COUNT" -ne 4 ]; then
              echo "❌ Strict kerneltoast expected 4 commits, processed ${KERNELTOAST_APPLIED_COUNT}"
              exit 1
            fi
            echo "✅ Kerneltoast patchset processed ${KERNELTOAST_APPLIED_COUNT}/4 commits (${KERNELTOAST_PATCH_POLICY})"
          else
            echo "⏭️  kerneltoast patchset disabled by policy"
          fi

          # 3. Fix KernelSU stack overflow in variant trees that still carry this implementation.
          if [ -f "drivers/kernelsu/app_profile.c" ] && grep -q "char comm\\[TASK_COMM_LEN\\];" drivers/kernelsu/app_profile.c; then
            python -c 'from pathlib import Path; p=Path("drivers/kernelsu/app_profile.c"); t=p.read_text(); p.write_text(t.replace("char comm[TASK_COMM_LEN];", "static char comm[TASK_COMM_LEN];", 1))'
            echo "✅ app_profile stack workaround applied"
          else
            echo "⏭️  app_profile stack workaround not needed"
          fi

          # 4. Fix localversion script appending dirty flags
          apply_repo_patch_or_fail ".github/patches/global/fix_setlocalversion_dirty.patch" "setlocalversion dirty suffix fix"

          if [ "${DIRTY_MODULE_ABI_BYPASS}" = "true" ]; then
            echo "⚠️  Applying dirty vendor module ABI bypass"
            apply_repo_patch_or_fail ".github/patches/global/dirty_allow_vendor_module_crcs.patch" "dirty vendor module CRC bypass"
            apply_repo_patch_or_fail ".github/patches/global/dirty_allow_vendor_module_vermagic.patch" "dirty vendor module vermagic bypass"
          fi

          # 5. Fix libbpf compilation error
          echo "🔧 Patching libbpf.c type casting..."
          apply_repo_patch_or_fail ".github/patches/global/fix_libbpf_strchr_cast.patch" "libbpf strchr cast fix"

          if [ "${GOVERNOR_MODE}" = "dynasched" ]; then
            echo "🔧 Installing dynasched cluster-aware governor..."
            cp "$GITHUB_WORKSPACE/.github/patches/global/cpufreq_dynasched.c" \
               kernel/sched/cpufreq_dynasched.c
            # Check if patch is already applied using reverse dry-run (most reliable for dirty builds)
            if patch -p1 --reverse --dry-run < "$GITHUB_WORKSPACE/.github/patches/global/add_dynasched_governor.patch" >/dev/null 2>&1; then
              echo "ℹ️ dynasched governor patch already applied, skipping."
              printf 'dynasched governor | kernel/sched/build_utility.c+drivers/cpufreq/Kconfig | already-present\n' >> "${PATCH_MANIFEST:-/dev/null}"
            else
              apply_repo_patch_or_fail ".github/patches/global/add_dynasched_governor.patch" "dynasched governor"
              printf 'dynasched governor | kernel/sched/build_utility.c+drivers/cpufreq/Kconfig | applied\n' >> "${PATCH_MANIFEST:-/dev/null}"
            fi

            if ! grep -q '^CONFIG_CPU_FREQ_GOV_DYNASCHED=y$' arch/arm64/configs/gki_defconfig 2>/dev/null; then
              echo "CONFIG_CPU_FREQ_GOV_DYNASCHED=y" >> arch/arm64/configs/gki_defconfig
            fi
            python3 - <<'PY'
          from pathlib import Path

          path = Path('drivers/cpufreq/Kconfig')
          text = path.read_text()
          if 'CPU_FREQ_DEFAULT_GOV_DYNASCHED' not in text:
              text = text.replace(
                  'default CPU_FREQ_DEFAULT_GOV_USERSPACE if ARM_SA1100_CPUFREQ || ARM_SA1110_CPUFREQ\n',
                  'default CPU_FREQ_DEFAULT_GOV_USERSPACE if ARM_SA1100_CPUFREQ || ARM_SA1110_CPUFREQ\n\tdefault CPU_FREQ_DEFAULT_GOV_DYNASCHED if ARM64\n',
                  1,
              )
              text = text.replace(
                  'endchoice\n\nconfig CPU_FREQ_GOV_PERFORMANCE',
                  'config CPU_FREQ_DEFAULT_GOV_DYNASCHED\n\tbool "dynasched"\n\tdepends on SMP\n\thelp\n\t  Use the dynasched Tensor G3 cluster-aware CPUFreq governor by default.\n\nendchoice\n\nconfig CPU_FREQ_GOV_PERFORMANCE',
                  1,
              )
          path.write_text(text)
          PY
            sed -i '/^CONFIG_CPU_FREQ_DEFAULT_GOV_/d' arch/arm64/configs/gki_defconfig
            echo "CONFIG_CPU_FREQ_DEFAULT_GOV_DYNASCHED=y" >> arch/arm64/configs/gki_defconfig
            printf 'dynasched governor source | kernel/sched/cpufreq_dynasched.c | applied\n' >> "${PATCH_MANIFEST:-/dev/null}"
          else
            echo "⏭️  dynasched governor disabled by governor_mode=${GOVERNOR_MODE}"
          fi

          echo "🔧 Installing KLapse livedisplay support..."
          KLAPSE_SRC="${RUNNER_TEMP:-/tmp}/klapse-src"
          rm -rf "$KLAPSE_SRC"
          git clone --depth=1 "$KLAPSE_REPO_URL" "$KLAPSE_SRC"
          mkdir -p drivers/video/klapse include/linux
          cp -a "$KLAPSE_SRC/drivers/video/klapse/." drivers/video/klapse/
          cp "$KLAPSE_SRC/include/linux/klapse.h" include/linux/klapse.h
          python3 - <<'PY'
          from pathlib import Path

          source = Path('drivers/video/klapse/klapse.c')
          text = source.read_text()
          text = text.replace('static void pulse(unsigned long data);', 'static void pulse(struct timer_list *t);')
          text = text.replace('static void set_rgb_flow(unsigned long data);', 'static void set_rgb_flow(struct timer_list *t);')
          text = text.replace('static DEFINE_TIMER(pulse_timer, pulse, 0, 0);', 'static DEFINE_TIMER(pulse_timer, pulse);')
          text = text.replace('static DEFINE_TIMER(flow_timer, set_rgb_flow, 0, 0);', 'static DEFINE_TIMER(flow_timer, set_rgb_flow);')
          text = text.replace('static void pulse(unsigned long data)', 'static void pulse(struct timer_list *t)')
          text = text.replace('static void set_rgb_flow(unsigned long data)', 'static void set_rgb_flow(struct timer_list *t)')
          text = text.replace('set_rgb_flow(0);', 'set_rgb_flow(NULL);')
          marker = '#include <linux/klapse.h>\n'
          fallback = marker + '\n#if !KLAPSE_MDSS\ncol_type_t kcal_red = MAX_SCALE;\ncol_type_t kcal_green = MAX_SCALE;\ncol_type_t kcal_blue = MAX_SCALE;\n#endif\n'
          text = text.replace(marker, fallback, 1)
          text = text.replace('void set_rgb_slider(bl_type_t bl_lvl)\n{', 'void set_rgb_slider(bl_type_t bl_lvl)\n{', 1)
          text = text.replace('MODULE_VERSION("5.0");', 'EXPORT_SYMBOL_GPL(set_rgb_slider);\nMODULE_VERSION("5.0");', 1)
          source.write_text(text)
          PY
          if ! grep -q 'source "drivers/video/klapse/Kconfig"' drivers/video/Kconfig; then
            printf '\nsource "drivers/video/klapse/Kconfig"\n' >> drivers/video/Kconfig
          fi
          if ! grep -q 'obj-$(CONFIG_KLAPSE).*klapse' drivers/video/Makefile; then
            printf '\nobj-$(CONFIG_KLAPSE) += klapse/\n' >> drivers/video/Makefile
          fi
          if ! grep -q '^CONFIG_KLAPSE=y$' arch/arm64/configs/gki_defconfig 2>/dev/null; then
            echo 'CONFIG_KLAPSE=y' >> arch/arm64/configs/gki_defconfig
          fi
          printf 'KLapse livedisplay | drivers/video/klapse+include/linux/klapse.h | applied\n' >> "${PATCH_MANIFEST:-/dev/null}"

          echo "🎨 Applying Pixel 8 display color backend hook..."
          if patch -p1 --forward --dry-run < "$GITHUB_WORKSPACE/.github/patches/global/klapse_backlight_hook.patch" >/dev/null 2>&1; then
            patch -p1 --forward < "$GITHUB_WORKSPACE/.github/patches/global/klapse_backlight_hook.patch"
            echo "✅ KLapse backlight hook applied"
            printf 'KLapse backlight hook | drivers/video/backlight/backlight.c | applied\n' >> "${PATCH_MANIFEST:-/dev/null}"
          elif patch -p1 --reverse --dry-run < "$GITHUB_WORKSPACE/.github/patches/global/klapse_backlight_hook.patch" >/dev/null 2>&1; then
            echo "ℹ️ KLapse backlight hook already present, skipping."
            printf 'KLapse backlight hook | drivers/video/backlight/backlight.c | already-present\n' >> "${PATCH_MANIFEST:-/dev/null}"
          else
            echo "⚠️ KLapse backlight hook could not be applied cleanly, display color management may not work"
            printf 'KLapse backlight hook | drivers/video/backlight/backlight.c | failed-non-fatal\n' >> "${PATCH_MANIFEST:-/dev/null}"
          fi

      - name: Verify Patched Tree
        run: |
          set -e
          mkdir -p success-metadata

          if [ -z "${PATCH_MANIFEST:-}" ]; then
            PATCH_MANIFEST="$GITHUB_WORKSPACE/logs/patch-manifest-${KSU_VARIANT}.txt"
            mkdir -p "$(dirname "$PATCH_MANIFEST")"
            : > "$PATCH_MANIFEST"
            echo "PATCH_MANIFEST=$PATCH_MANIFEST" >> "$GITHUB_ENV"
          fi

          echo "::group::Patch Verification"

          # Check for CONFIG_KSU in Kconfig (use grep instead of rg)
          if grep -q 'CONFIG_KSU' kernel/drivers/Kconfig 2>/dev/null; then
            echo "✅ CONFIG_KSU found in kernel/drivers/Kconfig"
          else
            echo "⚠️  CONFIG_KSU not immediately visible (may be in submodule)"
          fi

          # Verify SuSFS integration if enabled
          if [ "${ENABLE_SUSFS}" = "true" ]; then
            echo "🔍 Verifying SuSFS files..."

            # Check for SuSFS files
            if [ -f kernel/fs/susfs.c ]; then
              echo "✅ kernel/fs/susfs.c exists"
            else
              echo "⚠️  kernel/fs/susfs.c not found"
            fi

            if [ -f kernel/include/linux/susfs.h ]; then
              echo "✅ kernel/include/linux/susfs.h exists"
            else
              echo "⚠️  kernel/include/linux/susfs.h not found"
            fi

            # Verify Makefile entry for SuSFS
            if grep -q 'CONFIG_KSU_SUSFS.*susfs' kernel/fs/Makefile 2>/dev/null; then
              echo "✅ SuSFS Makefile entry found"
            else
              echo "⚠️  SuSFS Makefile entry not found (will be added during compile)"
            fi

            # Verify Kconfig entry for SuSFS
            if grep -q 'config KSU_SUSFS' kernel/drivers/kernelsu/Kconfig 2>/dev/null; then
              echo "✅ SuSFS Kconfig entry found"
            else
              if [ "${KSU_VARIANT}" = "next" ]; then
                echo "⚠️  Skipping SuSFS Kconfig check for KernelSU-Next (uses different integration)"
              else
                echo "⚠️  SuSFS Kconfig entry not found (will be added during compile)"
              fi
            fi

            # Verify hooks for tiann/kowsu/enhance (next/resukisu handle hooks differently)
            if [ "${KSU_VARIANT}" != "resukisu" ] && [ "${KSU_VARIANT}" != "next" ]; then
              if grep -rq 'ksu_init_rc_hook\|ksu_execveat_hook\|ksu_input_hook' kernel/drivers/kernelsu 2>/dev/null; then
                echo "✅ KSU hooks found"
              else
                echo "⚠️  KSU hooks not found in standard locations"
              fi
            fi
          fi

          # Write success metadata
          echo "📝 Writing build metadata..."
          {
            echo "variant=${KSU_VARIANT}"
            echo "kernel_ref=${{ needs.setup.outputs.kernel_ref }}"
            echo "susfs_ref=${{ needs.setup.outputs.susfs_ref }}"
            echo "ksu_repo=${KSU_REPO}"
            echo "ksu_ref=${KSU_BRANCH}"
            echo "enable_susfs=${ENABLE_SUSFS}"
            echo "dry_run=${DRY_RUN_ONLY:-false}"
            echo "tuning_profile=${TUNING_PROFILE}"
            echo "lto_mode=${LTO_MODE}"
            echo "make_jobs=${MAKE_JOBS_OVERRIDE}"
            echo "runtime_tuner=${RUNTIME_TUNER}"
            echo "governor_mode=${GOVERNOR_MODE}"
            echo "kerneltoast_patch_policy=${KERNELTOAST_PATCH_POLICY}"
            echo "dirty_module_abi_bypass=${DIRTY_MODULE_ABI_BYPASS}"
            echo "patch_repo_sha=${GITHUB_SHA}"
          } > "success-metadata/source-manifest-${KSU_VARIANT}.txt"

          echo "✅ Patch verification complete"
          echo "::endgroup::"

      - name: Stop After Patch Validation
        if: env.DRY_RUN_ONLY == 'true'
        run: |
          {
            echo "## Dry Run Complete"
            echo
            echo "- Variant: \`${{ matrix.variant }}\`"
            echo "- KernelSU repo: \`${{ env.KSU_REPO }}\`"
            echo "- KernelSU ref: \`${{ env.KSU_BRANCH }}\`"
            echo "- Kernel ref: \`${{ needs.setup.outputs.kernel_ref }}\`"
            echo "- SuSFS ref: \`${{ needs.setup.outputs.susfs_ref }}\`"
            echo "- Result: Patch and config verification passed; compile intentionally skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Kernel
        if: env.DRY_RUN_ONLY != 'true'
        run: |
          set -euo pipefail
          mkdir -p logs
          LOG_FILE="$GITHUB_WORKSPACE/logs/build-${{ matrix.variant }}.log"
          exec > >(tee -a "$LOG_FILE") 2>&1

          summarize_build_failure() {
            if [ ! -f "$LOG_FILE" ]; then
              return 0
            fi

            echo "::group::Build failure summary (${KSU_VARIANT})"
            echo "📄 Last 200 lines of $LOG_FILE"
            tail -n 200 "$LOG_FILE" || true
            echo
            echo "🔎 Matching error signatures"
            grep -nE 'error:|fatal error:|undefined reference|No rule to make target|FAILED:' "$LOG_FILE" | tail -n 80 || echo "No common error signature matched."
            echo "::endgroup::"
          }

          trap 'status=$?; if [ "$status" -ne 0 ]; then summarize_build_failure; fi; exit "$status"' EXIT

          cd kernel
          export ARCH=arm64
          export PATH="${{ env.CLANG_BIN }}:/usr/lib/ccache:$PATH"
          export CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}"
          export CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CC="ccache ${{ env.CLANG_BIN }}/clang"
          export CXX="ccache ${{ env.CLANG_BIN }}/clang++"
          export HOSTCC="ccache ${{ env.CLANG_BIN }}/clang"
          export HOSTCXX="ccache ${{ env.CLANG_BIN }}/clang++"
          export LD="${{ env.CLANG_BIN }}/ld.lld"
          export HOSTLD="${{ env.CLANG_BIN }}/ld.lld"
          export AR="${{ env.CLANG_BIN }}/llvm-ar"
          export HOSTAR="${{ env.CLANG_BIN }}/llvm-ar"
          export NM="${{ env.CLANG_BIN }}/llvm-nm"
          export OBJCOPY="${{ env.CLANG_BIN }}/llvm-objcopy"
          export OBJDUMP="${{ env.CLANG_BIN }}/llvm-objdump"
          export READELF="${{ env.CLANG_BIN }}/llvm-readelf"
          export STRIP="${{ env.CLANG_BIN }}/llvm-strip"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          if [ "${MAKE_JOBS_OVERRIDE}" = "auto" ]; then
            MAKE_JOBS="${BUILD_JOBS:-$(nproc)}"
          else
            MAKE_JOBS="${MAKE_JOBS_OVERRIDE}"
          fi
          export TMPDIR="${TMPDIR:-/mnt/ccache/kernel-tmp}"
          export TEMP="$TMPDIR"
          export TMP="$TMPDIR"
          export MAKEFLAGS="-j${MAKE_JOBS} -l${BUILD_LOAD:-$((MAKE_JOBS + 1))}"
          START_TIME=$SECONDS

          # Keep LOCALVERSION empty to preserve stock vermagic for vendor module compat.
          # Branding goes into BUILD_SALT (does not affect UTS_RELEASE / vermagic).
          KSU_LOCALVERSION='CONFIG_LOCALVERSION=""'
          KSU_BUILD_SALT='CONFIG_BUILD_SALT="deepongi"'

          add_gki_defconfig_once() {
            local line
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in \#*) continue ;; esac
              if ! grep -Fxq "$line" arch/arm64/configs/gki_defconfig; then
                echo "$line" >> arch/arm64/configs/gki_defconfig
              fi
            done
          }

          sed -i '/^CONFIG_KSU=/d' arch/arm64/configs/gki_defconfig

          cat <<EOF | add_gki_defconfig_once
          CONFIG_ARM64_CORTEX_X3=y
          CONFIG_ARM64_CORTEX_A715=y
          CONFIG_ARM64_CORTEX_A510=y
          CONFIG_ARM64_VA_BITS=48
          CONFIG_ARM64_PA_BITS=48
          CONFIG_SCHED_MC=y
          CONFIG_SCHED_CORE=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_CPU_FREQ=y
          CONFIG_THERMAL=y
          CONFIG_CMA=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_VENO=y
          CONFIG_TCP_CONG_YEAH=y
          CONFIG_TCP_CONG_ILLINOIS=y
          CONFIG_TCP_CONG_DCTCP=y
          CONFIG_TCP_CONG_CDG=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_IP_SET=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_IOSCHED_BFQ=y
          CONFIG_BFQ_GROUP_IOSCHED=y
          CONFIG_MQ_IOSCHED_DEADLINE=y
          CONFIG_MQ_IOSCHED_KYBER=y
          CONFIG_DEFAULT_IOSCHED="bfq"
          CONFIG_PM_DEVFREQ=y
          CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=y
          CONFIG_DEVFREQ_GOV_PERFORMANCE=y
          CONFIG_DEVFREQ_GOV_POWERSAVE=y
          CONFIG_DEVFREQ_GOV_USERSPACE=y
          CONFIG_MALI_MIDGARD=m
          CONFIG_MALI_PLATFORM_NAME="tensor"
          CONFIG_KSU_DEBUG=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOCALVERSION_AUTO=n
          ${KSU_LOCALVERSION}
          ${KSU_BUILD_SALT}
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          EOF

          printf '%s\n' 'CONFIG_KSU=y' | add_gki_defconfig_once

          if [ "${{ env.ENABLE_SUSFS }}" = "true" ]; then
            printf '%s\n' 'CONFIG_KSU_SUSFS=y' | add_gki_defconfig_once
          fi

          rm -f out/.config

          make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CC" LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" \
            READELF="$READELF" STRIP="$STRIP" HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" HOSTAR="$HOSTAR" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            O=out gki_defconfig

          PROFILE_FRAGMENT=out/pixel8-profile-${TUNING_PROFILE}.config
          : > "$PROFILE_FRAGMENT"

          case "${TUNING_PROFILE}" in
            performance)
              cat << 'EOF' >> "$PROFILE_FRAGMENT"
          CONFIG_HZ_300=y
          CONFIG_HZ=300
          CONFIG_UCLAMP_TASK=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          EOF
              ;;
            battery)
              cat << 'EOF' >> "$PROFILE_FRAGMENT"
          CONFIG_HZ_250=y
          CONFIG_HZ=250
          CONFIG_CPU_IDLE=y
          EOF
              ;;
            balanced)
              cat << 'EOF' >> "$PROFILE_FRAGMENT"
          CONFIG_HZ_300=y
          CONFIG_HZ=300
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          EOF
              ;;
          esac

          case "${LTO_MODE}" in
            thin)
              cat << 'EOF' >> out/.config
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_LTO_CLANG_FULL=n
          EOF
              ;;
            full)
              cat << 'EOF' >> out/.config
          CONFIG_LTO_CLANG_THIN=n
          CONFIG_LTO_CLANG_FULL=y
          EOF
              ;;
            none)
              cat << 'EOF' >> out/.config
          CONFIG_LTO_NONE=y
          CONFIG_LTO_CLANG_THIN=n
          CONFIG_LTO_CLANG_FULL=n
          EOF
              ;;
          esac

          cat "$PROFILE_FRAGMENT" >> out/.config

          # Re-enable BTF: Android 14 bpfloader requires /sys/kernel/btf/vmlinux
          # to load network/storage BPF programs at boot. Without it, bpfloader
          # fails -> init re-enters loop -> bootloop. Runner installs `dwarves`
          # (pahole >= 1.21) in the toolchain step.
          cat << 'EOF' >> out/.config
          CONFIG_DEBUG_INFO=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_DEBUG_INFO_REDUCED=n
          CONFIG_DEBUG_INFO_COMPRESSED_NONE=y
          EOF

          if [ "${DIRTY_MODULE_ABI_BYPASS}" = "true" ]; then
            cat << 'EOF' >> out/.config
          CONFIG_MODULE_FORCE_LOAD=y
          EOF
          fi

          make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CC" LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" \
            READELF="$READELF" STRIP="$STRIP" HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" HOSTAR="$HOSTAR" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            O=out syncconfig

          # Validate critical configs survived Kconfig sync
          echo "::group::Config Validation"
          CONFIG_ERRORS=0
          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "::error::CONFIG_KSU=y not set after Kconfig sync!"
            CONFIG_ERRORS=$((CONFIG_ERRORS + 1))
          fi
          if [ "${{ env.ENABLE_SUSFS }}" = "true" ] && ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
            echo "::error::CONFIG_KSU_SUSFS=y not set after Kconfig sync!"
            CONFIG_ERRORS=$((CONFIG_ERRORS + 1))
          fi
          if [ "$CONFIG_ERRORS" -gt 0 ]; then
            echo "::endgroup::"
            echo "::error::$CONFIG_ERRORS critical config(s) missing. Aborting build to avoid a non-functional kernel."
            echo "::group::Current .config (KSU/SuSFS lines)"
            grep -E 'CONFIG_KSU' out/.config || echo "(none found)"
            echo "::endgroup::"
            exit 1
          fi
          if ! grep -q '^CONFIG_LRU_GEN=y' out/.config; then
            echo "::warning::CONFIG_LRU_GEN=y (MGLRU) was requested but not set after Kconfig sync. Kernel tree may lack MGLRU support."
          fi
          echo "Config validation passed"
          echo "::endgroup::"

          if [ "${{ env.FORCE_CLEAN }}" = "true" ] && [ "${{ env.DIRTY_BUILD }}" != "true" ]; then
            make -j$MAKE_JOBS O=out clean
          fi

          make -j$MAKE_JOBS O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CC" LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" \
            READELF="$READELF" STRIP="$STRIP" HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" HOSTAR="$HOSTAR" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            all

          trap - EXIT

          echo "BUILD_TIME=$((SECONDS - START_TIME))s" >> $GITHUB_ENV
          ccache -s | grep -E "(Cacheable calls|Hits|Misses|Hit rate|cache size)" || true

      - name: Package Kernel (AnyKernel3)
        if: env.DRY_RUN_ONLY != 'true'
        run: |
          cd kernel
          KERNEL_VERSION=$(grep "^VERSION" Makefile | cut -d' ' -f3).$(grep "^PATCHLEVEL" Makefile | cut -d' ' -f3).$(grep "^SUBLEVEL" Makefile | cut -d' ' -f3)
          cd ..

          DIRTY_SUFFIX=""
          if [ "${DIRTY_MODULE_ABI_BYPASS}" = "true" ]; then
            DIRTY_SUFFIX="-dirtyabi"
          fi

          case "${{ matrix.variant }}" in
            "enhance") AK3_BRANCH="KernelSU" ;;
            "tiann") AK3_BRANCH="KernelSU" ;;
            "kowsu") AK3_BRANCH="KowSU" ;;
            "resukisu") AK3_BRANCH="resukisu" ;;
            "next") AK3_BRANCH="next" ;;
          esac

          git clone --depth=1 --branch=$AK3_BRANCH "${{ env.ANYKERNEL_REPO_URL }}" AnyKernel3 || git clone --depth=1 --branch=main "${{ env.ANYKERNEL_REPO_URL }}" AnyKernel3

          if ! grep -Eiq 'akita' AnyKernel3/anykernel.sh; then
            echo "::error::AnyKernel3 device assertions do not include Pixel 8a (akita). Refusing to package a potentially non-bootable zip."
            echo "::group::anykernel.sh (device-related lines)"
            grep -Ein 'device|model|codename|assert|getprop|ro\.product' AnyKernel3/anykernel.sh || true
            echo "::endgroup::"
            exit 1
          fi

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          [ -f kernel/out/arch/arm64/boot/dtb ] && cp kernel/out/arch/arm64/boot/dtb AnyKernel3/

          cd AnyKernel3 && rm -rf .git .github
          ZIP_NAME="AK3-${KERNEL_VERSION}-${{ matrix.variant }}${DIRTY_SUFFIX}-r${{ env.KSU_VERSION }}.zip"
          zip -r9 "../$ZIP_NAME" .
          cd ..

          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"

          # Generate lz4-compressed kernel image for direct boot.img patching
          if command -v lz4 >/dev/null 2>&1; then
            lz4 -9 -f kernel/out/arch/arm64/boot/Image "Image-${KERNEL_VERSION}-${{ matrix.variant }}${DIRTY_SUFFIX}.lz4"
            echo "IMAGE_LZ4=Image-${KERNEL_VERSION}-${{ matrix.variant }}${DIRTY_SUFFIX}.lz4" >> $GITHUB_ENV
          else
            echo "::warning::lz4 not available; skipping Image compression"
            echo "IMAGE_LZ4=" >> $GITHUB_ENV
          fi

          echo "KERNEL_ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Repack akita boot.img (ksud)
        if: env.DRY_RUN_ONLY != 'true' && matrix.variant != 'enhance'
        run: |
          set -e
          echo "::group::Repack akita boot.img via ksud"

          cd kernel
          KERNEL_VERSION=$(grep "^VERSION" Makefile | cut -d' ' -f3).$(grep "^PATCHLEVEL" Makefile | cut -d' ' -f3).$(grep "^SUBLEVEL" Makefile | cut -d' ' -f3)
          cd ..

          DIRTY_SUFFIX=""
          if [ "${DIRTY_MODULE_ABI_BYPASS}" = "true" ]; then
            DIRTY_SUFFIX="-dirtyabi"
          fi

          REPACK_DIR="$(mktemp -d)"

          # Build ksud from Tiann KernelSU source. Other KSU variants may not
          # ship a compatible host ksud, but Tiann boot-patch works for repack.
          TIANN_KSUD_STAGE="${GITHUB_WORKSPACE}/kernel/KernelSU"
          if [ ! -f "${TIANN_KSUD_STAGE}/Cargo.toml" ]; then
            TIANN_KSUD_STAGE="${GITHUB_WORKSPACE}/.tiann-ksu-src"
            rm -rf "${TIANN_KSUD_STAGE}"
            git clone --depth=1 --branch "${{ needs.setup.outputs.tiann_ref }}" "${TIANN_REPO_URL}" "${TIANN_KSUD_STAGE}" \
              || git clone --depth=1 "${TIANN_REPO_URL}" "${TIANN_KSUD_STAGE}"
          fi
          python3 - "${TIANN_KSUD_STAGE}/userspace/ksud/src/boot_patch.rs" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old_kmod = "\n".join([
              '        let kmod_file = workdir.join("kernelsu.ko");',
              '        if let Some(kmod) = kmod {',
              '            std::fs::copy(kmod, kmod_file).context("copy kernel module failed")?;',
              '        } else if !no_install {',
              '            // If kmod is not specified, extract from assets',
              '            println!("- KMI: {kmi}");',
              '            let name = format!("{kmi}_kernelsu.ko");',
              '            assets::copy_assets_to_file(&name, kmod_file)',
              '                .with_context(|| format!("Failed to copy {name}"))?;',
              '        }',
              '',
          ])
          new_kmod = "\n".join([
              '        let install_kmod = kmod.is_some();',
              '        let kmod_file = workdir.join("kernelsu.ko");',
              '        if let Some(kmod) = kmod {',
              '            std::fs::copy(kmod, kmod_file).context("copy kernel module failed")?;',
              '        }',
              '',
          ])
          old_add = "\n".join([
              '            do_cpio_cmd(',
              '                &magiskboot,',
              '                workdir,',
              '                ramdisk,',
              '                "add 0755 kernelsu.ko kernelsu.ko",',
              '            )?;',
              '',
          ])
          new_add = "\n".join([
              '            if install_kmod {',
              '                do_cpio_cmd(',
              '                    &magiskboot,',
              '                    workdir,',
              '                    ramdisk,',
              '                    "add 0755 kernelsu.ko kernelsu.ko",',
              '                )?;',
              '            }',
              '',
          ])
          text = text.replace(old_kmod, new_kmod)
          text = text.replace('            println!("- Adding KernelSU LKM");', '            println!("- Adding KernelSU init for built-in KSU kernel");')
          text = text.replace(old_add, new_add)
          path.write_text(text)
          PY
          command -v cargo >/dev/null || { echo "❌ cargo not found; cannot build tiann ksud"; exit 1; }
          rustup default stable
          rustup target add aarch64-unknown-linux-musl
          KSUINIT_LINKER="${ARM64_TOOLCHAIN}gcc"
          if [ ! -x "$KSUINIT_LINKER" ]; then
            KSUINIT_LINKER="$(command -v aarch64-linux-gnu-gcc || true)"
          fi
          if [ -z "$KSUINIT_LINKER" ]; then
            echo "❌ aarch64 linker not found; cannot build ksuinit"
            exit 1
          fi
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$KSUINIT_LINKER" \
            cargo build --manifest-path "${TIANN_KSUD_STAGE}/Cargo.toml" --release -p ksuinit --target aarch64-unknown-linux-musl
          mkdir -p "${TIANN_KSUD_STAGE}/userspace/ksud/bin/aarch64"
          cp "${TIANN_KSUD_STAGE}/target/aarch64-unknown-linux-musl/release/ksuinit" \
            "${TIANN_KSUD_STAGE}/userspace/ksud/bin/aarch64/ksuinit"
          cargo fix --manifest-path "${TIANN_KSUD_STAGE}/Cargo.toml" --bin "ksud" -p ksud --allow-dirty || true
          echo "🦀 Building tiann ksud from ${TIANN_KSUD_STAGE}..."
          cargo build --manifest-path "${TIANN_KSUD_STAGE}/Cargo.toml" --release -p ksud
          KSUD="${TIANN_KSUD_STAGE}/target/release/ksud"
          test -x "$KSUD"

          # Check for local stock boot.img first (self-hosted runner optimization).
          # actions/checkout runs under _work/, while the persistent repo lives
          # under /mnt/Android/gki-kernel-builder, so check both locations.
          LOCAL_BOOT_IMG=""
          for candidate in \
            "${GITHUB_WORKSPACE}/boot-images/stock-akita-cp1a.260505.005.a1.img" \
            "/mnt/Android/gki-kernel-builder/boot-images/stock-akita-cp1a.260505.005.a1.img"; do
            if [ -f "$candidate" ]; then
              LOCAL_BOOT_IMG="$candidate"
              break
            fi
          done

          if [ -n "$LOCAL_BOOT_IMG" ]; then
            echo "✅ Using local stock boot.img: $LOCAL_BOOT_IMG"
            cp "$LOCAL_BOOT_IMG" "${REPACK_DIR}/stock_boot.img"
          elif [ -n "${STOCK_BOOT_IMG_URL}" ] || [ -n "${STOCK_BOOT_GDRIVE_ID}" ]; then
            echo "📥 Downloading stock boot.img..."
            if [ -n "${STOCK_BOOT_GDRIVE_ID}" ]; then
              python3 -m pip install --user --quiet gdown
              export PATH="${HOME}/.local/bin:${PATH}"
              gdown --id "${STOCK_BOOT_GDRIVE_ID}" -O "${REPACK_DIR}/stock_boot.img"
            else
              curl -fsSL "${STOCK_BOOT_IMG_URL}" -o "${REPACK_DIR}/stock_boot.img"
            fi
          else
            echo "⚠️ No stock boot.img available (no local file, URL, or GDrive ID). Skipping repack."
            echo "::endgroup::"
            exit 0
          fi

          echo "🔧 Patching boot.img with ksud boot-patch..."
          "$KSUD" boot-patch \
            -b "${REPACK_DIR}/stock_boot.img" \
            -k "${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image" \
            --no-install \
            -o "${REPACK_DIR}"

          # ksud outputs patched file as kernelsu_patched_boot.img or similar
          PATCHED_IMG=$(find "${REPACK_DIR}" -name '*patched*boot*' -o -name 'new-boot.img' | head -1)
          if [ -z "$PATCHED_IMG" ] || [ ! -f "$PATCHED_IMG" ]; then
            echo "❌ ksud boot-patch did not produce a patched image"
            ls -la "${REPACK_DIR}/"
            exit 1
          fi

          BOOT_IMG_NAME="boot-${KERNEL_VERSION}-${{ matrix.variant }}${DIRTY_SUFFIX}-r${{ env.KSU_VERSION }}-akita.img"
          cp "$PATCHED_IMG" "${GITHUB_WORKSPACE}/${BOOT_IMG_NAME}"
          cd "${GITHUB_WORKSPACE}"

          sha256sum "${BOOT_IMG_NAME}" > "${BOOT_IMG_NAME}.sha256"
          echo "REPACK_BOOT_IMG=${BOOT_IMG_NAME}" >> $GITHUB_ENV

          # Cleanup
          rm -rf "${REPACK_DIR}"

          echo "✅ Repacked boot.img: ${BOOT_IMG_NAME}"
          echo "::endgroup::"

      - name: Generate Pixel 8 Runtime Tuner Script
        if: env.DRY_RUN_ONLY != 'true'
        run: |
          mkdir -p success-metadata
          TUNER_SCRIPT="success-metadata/pixel8-runtime-tuner-${{ matrix.variant }}.sh"
          GOV_MODE="${GOVERNOR_MODE}"
          if [ "${RUNTIME_TUNER}" != "true" ]; then
            cat << 'EOF' > "$TUNER_SCRIPT"
          #!/system/bin/sh
          # Runtime tuner generation disabled for this run.
          # Governor mode: __GOV_MODE__
          exit 0
          EOF
            sed -i "s/__GOV_MODE__/${GOV_MODE}/g" "$TUNER_SCRIPT"
            chmod +x "$TUNER_SCRIPT"
            exit 0
          fi
          cat << 'EOF' > "$TUNER_SCRIPT"
          #!/system/bin/sh
          # Pixel 8 runtime tuner for responsiveness + battery life.
          # Custom mode "dynasched" exports schedutil under a kernel-specific governor name.
          # Run as root (KernelSU/Magisk service.d) on boot.

          set -u
          GOV_MODE="__GOV_MODE__"

          LOG_TAG="dynasched-tuner"
          LOG_FILE="/data/local/tmp/dynasched.log"

          # Rotate log if larger than 512KB
          if [ -f "$LOG_FILE" ] && [ "$(wc -c < "$LOG_FILE" 2>/dev/null || echo 0)" -gt 524288 ]; then
            mv "$LOG_FILE" "${LOG_FILE}.old" 2>/dev/null || true
          fi

          log() {
            local ts
            ts="$(date '+%Y-%m-%d %H:%M:%S')"
            echo "[$ts] $*" >> "$LOG_FILE" 2>/dev/null
          }

          cleanup() {
            log "Received SIGTERM, resetting governor to schedutil"
            write_if_exists schedutil /sys/devices/system/cpu/cpufreq/policy*/scaling_governor
            # Reset max frequencies to safe stock values
            write_if_exists 1900000 /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq
            write_if_exists 2300000 /sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq
            write_if_exists 2400000 /sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq
            write_if_exists 2700000 /sys/devices/system/cpu/cpufreq/policy7/scaling_max_freq
            exit 0
          }

          trap cleanup SIGTERM SIGINT

          write_if_exists() {
            local value="$1"
            shift
            for node in "$@"; do
              [ -e "$node" ] && echo "$value" > "$node" 2>/dev/null || true
            done
          }

          governor_sysfs_dir() {
            if [ "$GOV_MODE" = "dynasched" ]; then
              echo dynasched
            else
              echo schedutil
            fi
          }

          apply_governor_defaults() {
            if [ "$GOV_MODE" = "dynasched" ]; then
              write_if_exists dynasched /sys/devices/system/cpu/cpufreq/policy*/scaling_governor
            else
              write_if_exists schedutil /sys/devices/system/cpu/cpufreq/policy*/scaling_governor
            fi
          }

          write_governor_tuning() {
            local up="$1"
            local down="$2"
            local gov_dir
            gov_dir="$(governor_sysfs_dir)"
            write_if_exists "$up" /sys/devices/system/cpu/cpufreq/policy*/"$gov_dir"/up_rate_limit_us
            write_if_exists "$down" /sys/devices/system/cpu/cpufreq/policy*/"$gov_dir"/down_rate_limit_us
          }

          set_policy_limits() {
            local policy="$1"
            local minf="$2"
            local maxf="$3"
            write_if_exists "$minf" "/sys/devices/system/cpu/cpufreq/${policy}/scaling_min_freq"
            write_if_exists "$maxf" "/sys/devices/system/cpu/cpufreq/${policy}/scaling_max_freq"
          }

          apply_dynasched() {
            local mode="$1"
            case "$mode" in
              eco)
                set_policy_limits policy0 300000 1700000
                set_policy_limits policy4 500000 2000000
                set_policy_limits policy6 500000 2100000
                set_policy_limits policy7 500000 2200000
                write_governor_tuning 25000 60000
                ;;
              turbo)
                set_policy_limits policy0 600000 2100000
                set_policy_limits policy4 700000 2600000
                set_policy_limits policy6 700000 2700000
                set_policy_limits policy7 900000 2918000
                write_governor_tuning 4000 12000
                ;;
              *)
                set_policy_limits policy0 300000 1900000
                set_policy_limits policy4 500000 2300000
                set_policy_limits policy6 500000 2400000
                set_policy_limits policy7 700000 2700000
                write_governor_tuning 9000 25000
                ;;
            esac
          }

          is_screen_off() {
            local brightness
            brightness=$(cat /sys/class/backlight/panel0-backlight/brightness 2>/dev/null || echo 1)
            [ "$brightness" -eq 0 ] && return 0
            return 1
          }

          get_thermal_temp() {
            # Read the hottest thermal zone (in millidegrees C)
            local max_temp=0
            for tz in /sys/class/thermal/thermal_zone*/temp; do
              [ -r "$tz" ] || continue
              local t
              t=$(cat "$tz" 2>/dev/null) || continue
              [ "${t:-0}" -gt "$max_temp" ] && max_temp="$t"
            done
            echo "$max_temp"
          }

          apply_governor_defaults

          # FKM / kernel-manager profile override support.
          # External managers write one of: performance, balanced, battery
          # to this file. The tuner respects it instead of auto-detecting.
          PROFILE_OVERRIDE_FILE="/data/local/tmp/.dynasched_profile"
          TCP_OVERRIDE_FILE="/data/local/tmp/.dynasched_tcp_congestion"

          # Initialize default files if missing
          if [ ! -f "$PROFILE_OVERRIDE_FILE" ]; then
            echo "auto" > "$PROFILE_OVERRIDE_FILE"
          fi
          if [ ! -f "$TCP_OVERRIDE_FILE" ]; then
            echo "bbr" > "$TCP_OVERRIDE_FILE"
          fi

          # Log available TCP congestion algorithms
          if [ -r /proc/sys/net/ipv4/tcp_available_congestion_control ]; then
            log "tcp_available=$(cat /proc/sys/net/ipv4/tcp_available_congestion_control)"
          fi
          log "tcp_active=$(cat /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null || echo unknown)"

          apply_tcp_congestion() {
            if [ -r "$TCP_OVERRIDE_FILE" ]; then
              local algo
              algo=$(cat "$TCP_OVERRIDE_FILE" 2>/dev/null | tr -d '[:space:]')
              if [ -n "$algo" ] && grep -qw "$algo" /proc/sys/net/ipv4/tcp_available_congestion_control 2>/dev/null; then
                echo "$algo" > /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null || true
              fi
            fi
          }

          # GPU Governor Management
          GPU_OVERRIDE_FILE="/data/local/tmp/.dynasched_gpu_governor"
          IO_OVERRIDE_FILE="/data/local/tmp/.dynasched_io_scheduler"
          DISPLAY_OVERRIDE_FILE="/data/local/tmp/.dynasched_display_mode"
          OVERCLOCK_FILE="/data/local/tmp/.dynasched_overclock"

          # Initialize state files with safe defaults if they don't exist
          [ -f "$GPU_OVERRIDE_FILE" ] || echo "auto" > "$GPU_OVERRIDE_FILE"
          [ -f "$IO_OVERRIDE_FILE" ] || echo "auto" > "$IO_OVERRIDE_FILE"
          [ -f "$DISPLAY_OVERRIDE_FILE" ] || echo "auto" > "$DISPLAY_OVERRIDE_FILE"
          [ -f "$OVERCLOCK_FILE" ] || echo "disabled" > "$OVERCLOCK_FILE"

          apply_gpu_governor() {
            local mode="$1"
            local gov=""
            case "$mode" in
              performance) gov="performance" ;;
              powersave) gov="powersave" ;;
              balanced) gov="simple_ondemand" ;;
              simple_ondemand) gov="simple_ondemand" ;;
              userspace) gov="userspace" ;;
              *) gov="simple_ondemand" ;;
            esac
            for node in /sys/class/devfreq/*/governor; do
              [ -e "$node" ] && echo "$gov" > "$node" 2>/dev/null || true
            done
          }

          apply_io_scheduler() {
            local sched="$1"
            case "$sched" in
              bfq|mq-deadline|kyber|none) ;;
              *) sched="bfq" ;;
            esac
            for queue in /sys/block/*/queue/scheduler; do
              [ -e "$queue" ] && echo "$sched" > "$queue" 2>/dev/null || true
            done
          }

          apply_display_mode() {
            local mode="$1"
            # Pixel 8 uses /sys/devices/platform/exynos-drm/* for panel control
            # Also try generic drm idle_timeout approach
            case "$mode" in
              60hz)
                write_if_exists 0 /sys/devices/platform/exynos-drm/*/idle_timeout
                for node in /sys/class/drm/card*/device/idle_timeout; do
                  [ -e "$node" ] && echo 0 > "$node" 2>/dev/null || true
                done
                # Force 60Hz by setting min refresh interval
                write_if_exists 16666 /sys/devices/platform/exynos-drm/*/min_vrefresh_interval
                ;;
              120hz)
                write_if_exists 1 /sys/devices/platform/exynos-drm/*/idle_timeout
                for node in /sys/class/drm/card*/device/idle_timeout; do
                  [ -e "$node" ] && echo 1 > "$node" 2>/dev/null || true
                done
                write_if_exists 8333 /sys/devices/platform/exynos-drm/*/min_vrefresh_interval
                ;;
              *)
                # Auto/adaptive: let the system manage refresh rate
                write_if_exists 100 /sys/devices/platform/exynos-drm/*/idle_timeout
                ;;
            esac
          }

          # Overclock safety constants (conservative 5-10% above stock max)
          OC_POLICY0_MAX=2100000   # stock max ~1900000, +10%
          OC_POLICY4_MAX=2500000   # stock max ~2300000, +8%
          OC_POLICY6_MAX=2600000   # stock max ~2400000, +8%
          OC_POLICY7_MAX=3000000   # stock max ~2700000, +11%

          SAFE_POLICY0_MAX=1900000
          SAFE_POLICY4_MAX=2300000
          SAFE_POLICY6_MAX=2400000
          SAFE_POLICY7_MAX=2700000

          THERMAL_OC_LIMIT=90000    # 90C - disable overclock
          BATTERY_OC_LIMIT=450      # 45C - disable overclock

          apply_overclock() {
            local oc_state
            oc_state=$(cat "$OVERCLOCK_FILE" 2>/dev/null | tr -d '[:space:]')

            # Only act if user has explicitly enabled overclock
            if [ "$oc_state" != "enabled" ]; then
              return
            fi

            local thermal_t
            thermal_t=$(get_thermal_temp)
            local batt_t
            batt_t=$(cat /sys/class/power_supply/battery/temp 2>/dev/null || echo 320)

            # Safety check: disable overclock if thermal limits exceeded
            if [ "${thermal_t:-0}" -ge "$THERMAL_OC_LIMIT" ] || [ "${batt_t:-320}" -ge "$BATTERY_OC_LIMIT" ]; then
              log "OVERCLOCK SAFETY: thermal=$thermal_t batt=$batt_t - forcing safe frequencies"
              # Reset to safe limits
              set_policy_limits policy0 300000 "$SAFE_POLICY0_MAX"
              set_policy_limits policy4 500000 "$SAFE_POLICY4_MAX"
              set_policy_limits policy6 500000 "$SAFE_POLICY6_MAX"
              set_policy_limits policy7 700000 "$SAFE_POLICY7_MAX"
              return
            fi

            # Apply overclock limits only to max freq
            write_if_exists "$OC_POLICY0_MAX" /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq
            write_if_exists "$OC_POLICY4_MAX" /sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq
            write_if_exists "$OC_POLICY6_MAX" /sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq
            write_if_exists "$OC_POLICY7_MAX" /sys/devices/system/cpu/cpufreq/policy7/scaling_max_freq
          }

          apply_tcp_congestion

          while true; do
            # Check for external profile override (FKM, Dynasched Manager, etc.)
            fkm_profile=""
            if [ -r "$PROFILE_OVERRIDE_FILE" ]; then
              fkm_profile=$(cat "$PROFILE_OVERRIDE_FILE" 2>/dev/null | tr -d '[:space:]')
            fi

            # Apply TCP congestion override each cycle
            apply_tcp_congestion

            batt_cap=$(cat /sys/class/power_supply/battery/capacity 2>/dev/null || echo 50)
            batt_temp=$(cat /sys/class/power_supply/battery/temp 2>/dev/null || echo 320)
            thermal_temp=$(get_thermal_temp)
            load_one=$(cut -d' ' -f1 /proc/loadavg 2>/dev/null || echo 0)
            load_int=${load_one%.*}

            # Use FKM override if set, otherwise auto-detect
            case "$fkm_profile" in
              performance)
                profile_mode="turbo"
                write_if_exists 110 /proc/sys/vm/swappiness
                write_if_exists 200 /proc/sys/vm/dirty_expire_centisecs
                ;;
              battery)
                profile_mode="eco"
                write_if_exists 60 /proc/sys/vm/swappiness
                write_if_exists 500 /proc/sys/vm/dirty_expire_centisecs
                ;;
              balanced)
                profile_mode="balanced"
                write_if_exists 90 /proc/sys/vm/swappiness
                write_if_exists 300 /proc/sys/vm/dirty_expire_centisecs
                ;;
              *)
                # Auto-detect based on device state
                if is_screen_off || [ "$batt_cap" -le 30 ] || [ "$batt_temp" -ge 420 ] || [ "${thermal_temp:-0}" -ge 85000 ]; then
                  profile_mode="eco"
                  write_if_exists 60 /proc/sys/vm/swappiness
                  write_if_exists 500 /proc/sys/vm/dirty_expire_centisecs
                elif [ "${load_int:-0}" -ge 5 ] && [ "$batt_temp" -le 390 ]; then
                  profile_mode="turbo"
                  write_if_exists 110 /proc/sys/vm/swappiness
                  write_if_exists 200 /proc/sys/vm/dirty_expire_centisecs
                else
                  profile_mode="balanced"
                  write_if_exists 90 /proc/sys/vm/swappiness
                  write_if_exists 300 /proc/sys/vm/dirty_expire_centisecs
                fi
                ;;
            esac

            log "profile=$profile_mode batt=$batt_cap% temp=$batt_temp thermal=$thermal_temp load=$load_one"

            if [ "$GOV_MODE" = "dynasched" ]; then
              apply_dynasched "$profile_mode"
            else
              # stock schedutil with adaptive response limits only
              if [ "$profile_mode" = "eco" ]; then
                write_governor_tuning 20000 50000
              elif [ "$profile_mode" = "turbo" ]; then
                write_governor_tuning 4000 12000
              else
                write_governor_tuning 8000 20000
              fi
            fi

            # Apply GPU governor based on override or profile
            gpu_mode=""
            if [ -r "$GPU_OVERRIDE_FILE" ]; then
              gpu_mode=$(cat "$GPU_OVERRIDE_FILE" 2>/dev/null | tr -d '[:space:]')
            fi
            case "$gpu_mode" in
              performance|powersave|balanced|simple_ondemand|userspace) apply_gpu_governor "$gpu_mode" ;;
              *) apply_gpu_governor "$profile_mode" ;;
            esac

            # Apply I/O scheduler based on override or profile
            io_sched=""
            if [ -r "$IO_OVERRIDE_FILE" ]; then
              io_sched=$(cat "$IO_OVERRIDE_FILE" 2>/dev/null | tr -d '[:space:]')
            fi
            case "$io_sched" in
              bfq|mq-deadline|kyber|none) apply_io_scheduler "$io_sched" ;;
              *)
                case "$profile_mode" in
                  eco) apply_io_scheduler "bfq" ;;
                  turbo) apply_io_scheduler "none" ;;
                  *) apply_io_scheduler "bfq" ;;
                esac
                ;;
            esac

            # Apply display mode based on override or profile
            disp_mode=""
            if [ -r "$DISPLAY_OVERRIDE_FILE" ]; then
              disp_mode=$(cat "$DISPLAY_OVERRIDE_FILE" 2>/dev/null | tr -d '[:space:]')
            fi
            case "$disp_mode" in
              60hz|120hz) apply_display_mode "$disp_mode" ;;
              *)
                case "$profile_mode" in
                  eco) apply_display_mode "60hz" ;;
                  turbo) apply_display_mode "120hz" ;;
                  *) apply_display_mode "auto" ;;
                esac
                ;;
            esac

            # Apply overclock (function checks oc_state internally)
            apply_overclock

            sleep 20
          done
          EOF

          sed -i "s/__GOV_MODE__/${GOV_MODE}/g" "$TUNER_SCRIPT"
          chmod +x "$TUNER_SCRIPT"

      - name: Upload Artifacts
        if: env.DRY_RUN_ONLY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.variant }}-${{ github.run_number }}
          path: |
            ${{ env.KERNEL_ZIP }}
            ${{ env.KERNEL_ZIP }}.sha256
            ${{ env.IMAGE_LZ4 }}
            ${{ env.REPACK_BOOT_IMG }}
            ${{ env.REPACK_BOOT_IMG }}.sha256
            ${{ env.CHANGELOG_FILE }}
            logs/build-${{ matrix.variant }}.log
            kernel/out/.config
            kernel/out/pixel8-profile-${{ env.TUNING_PROFILE }}.config
            success-metadata/pixel8-runtime-tuner-${{ matrix.variant }}.sh
            ${{ env.PATCH_MANIFEST }}
            success-metadata/source-manifest-${{ matrix.variant }}.txt

      - name: Collect Failure Logs
        if: failure()
        run: |
          ARTIFACT_DIR="failure-logs/${{ matrix.variant }}"
          mkdir -p "$ARTIFACT_DIR"

          [ -f "logs/build-${{ matrix.variant }}.log" ] && cp "logs/build-${{ matrix.variant }}.log" "$ARTIFACT_DIR/"
          [ -f "logs/patch-failure-${{ matrix.variant }}.log" ] && cp "logs/patch-failure-${{ matrix.variant }}.log" "$ARTIFACT_DIR/"
          [ -f "kernel/out/.config" ] && cp "kernel/out/.config" "$ARTIFACT_DIR/out.config"
          [ -f "kernel/.config" ] && cp "kernel/.config" "$ARTIFACT_DIR/kernel.config"
          [ -f "${{ env.CHANGELOG_FILE }}" ] && cp "${{ env.CHANGELOG_FILE }}" "$ARTIFACT_DIR/"
          [ -n "${{ env.PATCH_MANIFEST }}" ] && [ -f "${{ env.PATCH_MANIFEST }}" ] && cp "${{ env.PATCH_MANIFEST }}" "$ARTIFACT_DIR/"
          [ -f "success-metadata/source-manifest-${{ matrix.variant }}.txt" ] && cp "success-metadata/source-manifest-${{ matrix.variant }}.txt" "$ARTIFACT_DIR/"
          find kernel -type f \( -name "*.rej" -o -name "*.orig" \) -exec cp --parents {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          find kernel/out -maxdepth 3 -type f \
            \( -name "*.log" -o -name "*.cmd" -o -name "*.tmp" -o -name ".config.old" \) \
            -exec cp --parents {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

          for RUNNER_DIR in /actions-runner /home/runner/actions-runner /home/deepongi/actions-runner /opt/actions-runner /mnt/Hawai/actions-runner; do
            if [ -d "$RUNNER_DIR/_diag" ]; then
              mkdir -p "$ARTIFACT_DIR/runner-diag"
              cp -a "$RUNNER_DIR/_diag/." "$ARTIFACT_DIR/runner-diag/" 2>/dev/null || true
            fi

            if [ -d "$RUNNER_DIR/_work/_temp" ]; then
              mkdir -p "$ARTIFACT_DIR/runner-temp"
              cp -a "$RUNNER_DIR/_work/_temp/." "$ARTIFACT_DIR/runner-temp/" 2>/dev/null || true
            fi
          done

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-logs-${{ matrix.variant }}-${{ github.run_number }}
          path: failure-logs/${{ matrix.variant }}
          if-no-files-found: warn

      - name: Write Job Summary
        if: always()
        run: |
          {
            echo "## Variant \`${{ matrix.variant }}\`"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Dry run | \`${{ env.DRY_RUN_ONLY }}\` |"
            echo "| KernelSU repo | \`${{ env.KSU_REPO }}\` |"
            echo "| KernelSU ref | \`${{ env.KSU_BRANCH }}\` |"
            echo "| Kernel ref | \`${{ needs.setup.outputs.kernel_ref }}\` |"
            echo "| SuSFS ref | \`${{ needs.setup.outputs.susfs_ref }}\` |"
            echo "| KSU version | \`r${{ env.KSU_VERSION }}\` |"
            echo "| Tuning profile | \`${{ env.TUNING_PROFILE }}\` |"
            echo "| LTO mode | \`${{ env.LTO_MODE }}\` |"
            echo "| Make jobs | \`${{ env.MAKE_JOBS_OVERRIDE }}\` |"
            echo "| Runtime tuner script | \`${{ env.RUNTIME_TUNER }}\` |"
            echo "| Governor mode | \`${{ env.GOVERNOR_MODE }}\` |"
            echo "| kerneltoast patch policy | \`${{ env.KERNELTOAST_PATCH_POLICY }}\` |"
            echo "| Build log | \`logs/build-${{ matrix.variant }}.log\` |"
            if [ "${{ env.DRY_RUN_ONLY }}" != "true" ] && [ -n "${{ env.KERNEL_ZIP }}" ]; then
              echo "| ZIP artifact | \`${{ env.KERNEL_ZIP }}\` |"
            fi
            if [ -n "${{ env.PATCH_MANIFEST }}" ]; then
              echo "| Patch manifest | \`${{ env.PATCH_MANIFEST }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  create_release:
    needs: [setup, build]
    runs-on: ${{ inputs.use_self_hosted && fromJSON('["self-hosted", "linux", "x64", "pixel8-wsl"]') || 'ubuntu-latest' }}
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.create_release == 'true' && needs.build.result == 'success' && needs.setup.outputs.dry_run != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Create GitHub Release
        run: |
          if [ ! -d release-assets ]; then
            echo "No release-assets directory found; no artifacts were produced for this run."
            exit 0
          fi

          cd release-assets
          find . -type f -exec mv {} . \; 2>/dev/null || true

          # Safety check: Only create release if at least one ZIP was actually built
          if ! ls *.zip 1> /dev/null 2>&1; then
            echo "❌ No ZIP artifacts found! All matrix builds must have failed. Skipping release."
            exit 0
          fi

          RELEASE_NOTES="**Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **SuSFS:** ${{ inputs.disable_susfs && '❌ Disabled' || '✅ Enabled' }}

          ### Devices Supported
          - Pixel 8, 8a, 8 Pro

          Flash ZIP in Kernel Flasher or extract Image to patch boot.img manually."

          RELEASE_TAG="build-${{ github.run_number }}"
          RELEASE_TITLE="Android 14 Kernel Build #${{ github.run_number }}"

          # Added ./*.md to upload the changelogs alongside the zips!
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ℹ️ Release $RELEASE_TAG already exists; updating notes and replacing artifacts."
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --repo "${{ github.repository }}"
            gh release upload "$RELEASE_TAG" --repo "${{ github.repository }}" --clobber ./*.zip ./*.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --repo "${{ github.repository }}" \
              ./*.zip ./*.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [setup, create_release, build]
    runs-on: ${{ inputs.use_self_hosted && fromJSON('["self-hosted", "linux", "x64", "pixel8-wsl"]') || 'ubuntu-latest' }}
    if: always() && inputs.enable_telegram && needs.setup.outputs.dry_run != 'true'
    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          STATUS="${{ needs.build.result }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="⚠️"
          [ "$STATUS" == "failure" ] && ICON="❌"

          # Format variables
          IS_CLEAN="${{ inputs.force_clean_build && 'Yes' || 'No' }}"
          IS_SUSFS="${{ inputs.disable_susfs && 'Disabled' || 'Enabled' }}"
          DO_REL="${{ inputs.create_release && 'Yes' || 'No' }}"

          # Use HTML parsing to completely avoid Markdown character breaking (hyphens/underscores)
          cat << EOF > tg_message.txt
          $ICON <b>Kernel Build ${STATUS^^}</b>
          ━━━━━━━━━━━━━━━━━━━━━
          📱 <b>Target:</b> Pixel 8 / 8a / 8 Pro
          🛠️ <b>Variant(s):</b> ${{ inputs.ksu_variant }}
          🛡️ <b>SuSFS:</b> $IS_SUSFS
          🧹 <b>Clean Build:</b> $IS_CLEAN
          📦 <b>Release Created:</b> $DO_REL
          👤 <b>Triggered by:</b> <a href="https://github.com/${{ github.actor }}">${{ github.actor }}</a>

          🔗 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Run Logs & Artifacts</a>
          EOF

          # Safely URL-encode the file using --data-urlencode text@filename
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text@tg_message.txt \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true
