name: Build Kernel Manager App

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "APK variant to compile"
        required: true
        default: both
        type: choice
        options:
          - both
          - debug
          - release
  push:
    paths:
      - "kernel-manager-app/**"
      - ".github/workflows/manager-build.yml"
  pull_request:
    paths:
      - "kernel-manager-app/**"
      - ".github/workflows/manager-build.yml"

concurrency:
  group: manager-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_VARIANT: ${{ inputs.build_variant || 'both' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Selected APK Variant
        run: |
          case "${BUILD_VARIANT}" in
            debug) gradle -p kernel-manager-app assembleDebug ;;
            release) gradle -p kernel-manager-app assembleRelease ;;
            both) gradle -p kernel-manager-app assembleDebug assembleRelease ;;
            *) echo "Invalid build_variant: ${BUILD_VARIANT}" && exit 1 ;;
          esac

      - name: Upload Debug APK
        if: env.BUILD_VARIANT == 'debug' || env.BUILD_VARIANT == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-manager-debug-apk
          path: kernel-manager-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        if: env.BUILD_VARIANT == 'release' || env.BUILD_VARIANT == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-manager-release-apk
          path: kernel-manager-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
